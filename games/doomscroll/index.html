<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doomscroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbeae4;
    --pink-deep: #f6dcd3;
    --card-bg: #fffaf7;
    --phone-shell: #131316;
    --screen-dark: #0d0d10;
    --panel-2: #1a1a1e;
    --orange: #ff5a1f;
    --red: #ff2d55;
    --gold: #c98f00;
    --ink: #23201d;
    --text: #23201d;
    --text-dim: #56504a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background-image:
      radial-gradient(circle, rgba(35,32,29,0.07) 1px, transparent 1px);
    background-size: 28px 28px;
  }

  body::before,
  body::after {
    content: "";
    position: fixed;
    width: 65vw;
    height: 65vw;
    max-width: 850px;
    max-height: 850px;
    border-radius: 50%;
    filter: blur(90px);
    z-index: 0;
    pointer-events: none;
  }
  body::before {
    top: -15%;
    left: -15%;
    background: radial-gradient(circle, rgba(255,45,85,0.16), transparent 70%);
  }
  body::after {
    bottom: -15%;
    right: -15%;
    background: radial-gradient(circle, rgba(255,90,31,0.16), transparent 70%);
  }

  .stage-panel {
    position: relative;
    z-index: 1;
    transform-origin: center center;
  }

  .back-link {
    position: fixed;
    top: 20px;
    left: 24px;
    z-index: 5;
    font-size: 0.85rem;
    color: var(--text-dim);
    text-decoration: none;
    padding: 6px 12px;
    border: 2px solid var(--ink);
    border-radius: 999px;
    background: var(--card-bg);
    transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
  }
  .back-link:hover {
    background: var(--orange);
    color: #fff;
    border-color: var(--orange);
    transform: translateY(-1px);
  }

  #fitWrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    transform-origin: center center;
    position: relative;
    z-index: 1;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.6rem, 8vw, 3.6rem);
    letter-spacing: 0.05em;
    color: var(--text);
    margin: 0 0 0.15rem;
  }
  h1 span { color: var(--orange); }

  .tagline {
    color: var(--text-dim);
    font-size: 1.05rem;
    margin: 0 0 1rem;
    text-align: center;
  }

  .hero-stat { text-align: center; margin-bottom: 1.1rem; }

  .hero-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.6rem, 7vw, 3.4rem);
    line-height: 1;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  .hero-sub { font-size: 1rem; color: var(--text-dim); margin-top: 6px; }

  .hero-rule {
    width: 150px; height: 5px; background: var(--pink-deep);
    margin: 10px auto 8px; border-radius: 3px; overflow: hidden; position: relative;
    border: 1.5px solid var(--ink);
  }

  .hero-rule-fill {
    position: absolute; inset: 0; width: 0%;
    background: var(--orange);
    transition: width 0.3s ease;
  }

  .apps-lede { font-size: 1.15rem; color: var(--text); font-weight: 500; }
  .apps-lede b { color: var(--orange); }

  .clout-row {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .clout-row span {
    font-size: 0.78rem;
    color: var(--text-dim);
  }
  .clout-row span b { color: var(--red); }
  .viral-btn {
    position: relative;
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    font-weight: 500;
    color: #fff;
    background: var(--red);
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 11px 28px;
    cursor: default;
    box-shadow: 0 0 0 var(--spread, 0px) rgba(255,45,85, var(--glow, 0));
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }
  .viral-btn.ready {
    cursor: pointer;
    animation: viralGlow 1.4s ease-in-out infinite;
  }
  .viral-btn.ready:hover { background: var(--orange); transform: translateY(-1px); }

  @keyframes viralGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,45,85,0.5); }
    50% { box-shadow: 0 0 0 10px rgba(255,45,85,0); }
  }

  .game-row {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 6rem;
  }

  .apps-column { width: 310px; }
  .apps-column-left { display: flex; flex-direction: column; }
  .apps-column-right { height: 800px; display: flex; align-items: center; }

  .side-header { text-align: center; margin-bottom: 32px; }
  .apps-list {
    display: flex; flex-direction: column; gap: 34px; width: 100%;
  }

  .app-item {
    display: flex; align-items: center; gap: 18px; width: 100%;
    background: none; border: none; cursor: pointer;
    font-family: 'DM Mono', monospace; padding: 10px; border-radius: 14px;
    text-align: left; transition: background 0.15s ease;
    position: relative; z-index: 1;
  }

  .app-item:not(:disabled):hover { background: var(--pink-deep); }
  .app-item:disabled { cursor: default; opacity: 0.4; }

  .app-icon {
    position: relative; width: 92px; height: 92px; border-radius: 24px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    border: 2.5px solid var(--ink);
  }

  .app-icon svg { width: 46px; height: 46px; }

  .app-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .app-name { font-size: 1.05rem; color: var(--text); line-height: 1.25; }
  .app-owned {
    display: inline-block;
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem; font-weight: 600;
    color: #241a00; background: var(--gold);
    border: 1.5px solid var(--ink);
    border-radius: 999px; padding: 2px 10px;
    white-space: nowrap;
    margin-top: 2px;
  }
  .app-cost { font-size: 0.88rem; color: var(--orange); }
  .app-item:disabled .app-cost { color: var(--text-dim); }

  .phone-column { display: flex; flex-direction: column; align-items: center; }
  .stage { position: relative; }

  .stage::before {
    content: ""; position: absolute; width: 620px; height: 620px;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255, 90, 31, 0.22), transparent 70%);
    filter: blur(10px); z-index: 0;
  }

  .phone {
    position: relative; z-index: 1; width: 400px; height: 800px;
    background: var(--phone-shell); border-radius: 54px;
    border: 2px solid #26262b;
    padding: 16px;
  }

  .screen {
    position: relative; width: 100%; height: 100%;
    background: var(--screen-dark); border-radius: 36px;
    overflow: hidden; cursor: pointer; user-select: none; touch-action: manipulation;
  }

  .notch {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 106px; height: 24px; background: var(--phone-shell);
    border-radius: 0 0 14px 14px; z-index: 3;
  }

  .home-indicator {
    position: absolute; bottom: 9px; left: 50%; transform: translateX(-50%);
    width: 132px; height: 5px; border-radius: 2px;
    background: rgba(255,255,255,0.18); z-index: 3;
  }

  .feed {
    position: absolute; top: 24px; left: 0; right: 0; padding: 13px;
    display: flex; flex-direction: column; gap: 12px; will-change: transform;
  }

  .screen { --screen-text: #f2f0eb; --screen-text-dim: #8a8a8f; }

  .post { background: var(--panel-2); border-radius: 9px; padding: 8px; flex-shrink: 0; }

  .post-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .avatar { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; }
  .avatar.small { width: 13px; height: 13px; }
  .handle { font-size: 0.6rem; color: var(--screen-text-dim); }
  .caption { font-size: 0.66rem; color: var(--screen-text); line-height: 1.3; }

  .media { height: 54px; border-radius: 7px; margin-bottom: 5px; }
  .media.tall { height: 86px; display: flex; align-items: center; justify-content: center; position: relative; }

  .play-icon {
    width: 0; height: 0;
    border-left: 11px solid rgba(255,255,255,0.85);
    border-top: 7px solid transparent; border-bottom: 7px solid transparent;
  }

  .duration {
    position: absolute; bottom: 5px; right: 6px;
    background: rgba(0,0,0,0.55); color: #fff;
    font-size: 0.54rem; padding: 1px 4px; border-radius: 4px;
  }

  .eng-row { display: flex; gap: 10px; margin-top: 6px; }
  .eng-row span { font-size: 0.58rem; color: var(--screen-text-dim); }

  .quote-mark {
    font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; color: var(--orange);
    line-height: 1; margin-bottom: 2px;
  }
  .quote-text { font-size: 0.7rem; color: var(--screen-text); line-height: 1.35; }

  .poll-row { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
  .poll-label { font-size: 0.56rem; color: var(--screen-text-dim); width: 56px; flex-shrink: 0; }
  .poll-pct { font-size: 0.56rem; color: var(--orange); width: 28px; text-align: right; flex-shrink: 0; }
  .poll-bar { flex: 1; height: 8px; border-radius: 4px; background: #232327; overflow: hidden; }
  .poll-fill { height: 100%; background: var(--orange); }

  .tap-ripple {
    position: absolute; border-radius: 50%;
    background: rgba(255, 90, 31, 0.35);
    transform: translate(-50%, -50%) scale(0);
    opacity: 1; pointer-events: none; z-index: 4;
    transition: transform 0.5s ease-out, opacity 0.5s ease-out;
  }
  .tap-ripple.pop { transform: translate(-50%, -50%) scale(1); opacity: 0; }

  .tap-hint { margin-top: 0.7rem; text-align: center; font-size: 0.9rem; color: var(--text-dim); }

  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: #1a1a1e; border: 1px solid var(--gold); color: var(--gold);
    padding: 0.6rem 1.1rem; border-radius: 8px; font-size: 0.74rem;
    opacity: 0; transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 10; text-align: center; max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .bg-particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }

  .particle {
    position: absolute;
    bottom: -10px;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--orange);
    opacity: 0;
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0%   { transform: translateY(0); opacity: 0; }
    8%   { opacity: 0.55; }
    92%  { opacity: 0.4; }
    100% { transform: translateY(-100vh); opacity: 0; }
  }
</style>
</head>
<body>

<div class="bg-particles" id="bgParticles"></div>

<a class="back-link" href="../../index.html">&larr; all games</a>

<div class="stage-panel">
<div id="fitWrapper">
  <div class="game-row">
    <div class="apps-column apps-column-left">
      <div class="side-header">
        <h1>Doom<span>scroll</span></h1>
        <p class="tagline">the feed never ends. neither should you.</p>

        <div class="hero-stat">
          <div class="hero-number" id="distanceVal">0.0 m</div>
          <div class="hero-sub" id="milestoneSub">next up: a doorframe</div>
          <div class="hero-rule"><div class="hero-rule-fill" id="milestoneBar"></div></div>
          <div class="apps-lede" id="spLede">you have 0 points to spend</div>
          <div class="clout-row" id="cloutRow">
            <span id="cloutStatus">0 clout &middot; scrolling at normal speed</span>
            <button class="viral-btn" id="viralBtn" disabled>go viral</button>
          </div>
        </div>
      </div>
      <div class="apps-list" id="appsLeft"></div>
    </div>

    <div class="phone-column">
      <div class="stage">
        <div class="phone">
          <div class="screen" id="phone">
            <div class="notch"></div>
            <div class="feed" id="feed"></div>
            <div class="home-indicator"></div>
          </div>
        </div>
      </div>
      <div class="tap-hint" id="tapHint">tap to scroll</div>
    </div>

    <div class="apps-column apps-column-right">
      <div class="apps-list" id="appsRight"></div>
    </div>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ---------- icons: flat solid squares, simple line-art (no gradients) ----------
  const icons = {
    ghost: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 20V10a6 6 0 0112 0v10l-2-1.6L14 20l-2-1.6L10 20l-2-1.6L6 20z"/>
      <circle cx="9.3" cy="10.5" r="0.9" fill="#fff" stroke="none"/>
      <circle cx="14.7" cy="10.5" r="0.9" fill="#fff" stroke="none"/>
    </svg>`,
    bolt: `<svg viewBox="0 0 24 24" fill="#fff" stroke="none">
      <path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/>
    </svg>`,
    robot: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="9" width="14" height="10" rx="2.2"/>
      <line x1="12" y1="9" x2="12" y2="5"/>
      <circle cx="12" cy="3.6" r="1.1" fill="#fff" stroke="none"/>
      <circle cx="9" cy="13.5" r="1" fill="#fff" stroke="none"/>
      <circle cx="15" cy="13.5" r="1" fill="#fff" stroke="none"/>
    </svg>`,
    factory: `<svg viewBox="0 0 24 24" fill="#fff" stroke="none">
      <path d="M4 21V13.2l4 2.5v-2.5l4 2.5v-2.5l4 2.5V9h2v12H4z"/>
    </svg>`,
    eye: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>`,
    infinity: `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 9a3 3 0 100 6 3 3 0 002.5-1.3L12 10l3.5 3.7A3 3 0 1018 8a3 3 0 00-2.5 1.3L12 14 8.5 10.3A3 3 0 006 9z"/>
    </svg>`
  };

  // ---------- feed content: flat solid colors, no gradients ----------
  const avatarColors = ['#ff5a1f', '#4361ee', '#00c2a8', '#e0b400', '#a855f7'];

  const postsData = [
    { type: 'text',  user: '@night_owl_42',    caption: "day 47 of pretending to work" , likes: '842',  comments: '31' },
    { type: 'image', user: '@snacksandregret', caption: "my plant looked better before I ‘helped’ it", likes: '2.1K', comments: '88' },
    { type: 'video', user: '@sleepdeprived',   caption: "POV: it's monday and you already regret everything", duration: '0:38', likes: '5.4K', comments: '210' },
    { type: 'quote', user: '@notyourbestie',   text: "if you're reading this, it's already too late to go to bed on time." },
    { type: 'poll',  question: "is cereal a soup?", optA: 'yes', pctA: 62, optB: 'no', pctB: 38 },
    { type: 'text',  user: '@feralthoughts',   caption: "she said ‘we need to talk’ and now I'm feral", likes: '1.3K', comments: '64' },
    { type: 'video', user: '@zerobudget',      caption: "just spent $40 on stuff I didn't need, we thriving", duration: '1:02', likes: '760', comments: '19' },
    { type: 'image', user: '@catlaw',          caption: "my cat judged me today. accurate.", likes: '3.8K', comments: '145' },
    { type: 'poll',  question: "pineapple on pizza?", optA: 'yes', pctA: 44, optB: 'absolutely not', pctB: 56 },
    { type: 'text',  user: '@nothoughtshead',  caption: "rating my life choices: 2 out of 10, no thoughts just vibes", likes: '509', comments: '22' },
    { type: 'quote', user: '@askingnicely',    text: "asked the universe for one thing today. got zero things." },
    { type: 'image', user: '@vibecheck',       caption: "why does my coffee cost more than my rent", likes: '6.7K', comments: '301' }
  ];

  function avatarHtml(i) {
    return `<div class="avatar" style="background:${avatarColors[i % avatarColors.length]}"></div>`;
  }

  function renderPost(d, i) {
    if (d.type === 'text') {
      return `<div class="post">
        <div class="post-head">${avatarHtml(i)}<div class="handle">${d.user}</div></div>
        <div class="caption">${d.caption}</div>
        <div class="eng-row"><span>&#9825; ${d.likes}</span><span>&#9998; ${d.comments}</span></div>
      </div>`;
    }
    if (d.type === 'image') {
      return `<div class="post">
        <div class="post-head">${avatarHtml(i)}<div class="handle">${d.user}</div></div>
        <div class="caption" style="margin-bottom:5px;">${d.caption}</div>
        <div class="media" style="background:${avatarColors[i % avatarColors.length]}"></div>
        <div class="eng-row"><span>&#9825; ${d.likes}</span><span>&#9998; ${d.comments}</span></div>
      </div>`;
    }
    if (d.type === 'video') {
      return `<div class="post">
        <div class="post-head">${avatarHtml(i)}<div class="handle">${d.user}</div></div>
        <div class="caption" style="margin-bottom:5px;">${d.caption}</div>
        <div class="media tall" style="background:${avatarColors[i % avatarColors.length]}">
          <div class="play-icon"></div>
          <div class="duration">${d.duration}</div>
        </div>
        <div class="eng-row"><span>&#9825; ${d.likes}</span><span>&#9998; ${d.comments}</span></div>
      </div>`;
    }
    if (d.type === 'quote') {
      return `<div class="post">
        <div class="quote-mark">&ldquo;</div>
        <div class="quote-text">${d.text}</div>
        <div class="post-head" style="margin-top:8px;">${avatarHtml(i).replace('avatar', 'avatar small')}<div class="handle" style="font-size:0.56rem;">${d.user}</div></div>
      </div>`;
    }
    if (d.type === 'poll') {
      return `<div class="post">
        <div class="post-head">${avatarHtml(i)}<div class="handle">poll</div></div>
        <div class="caption" style="margin-bottom:7px;">${d.question}</div>
        <div class="poll-row"><span class="poll-label">${d.optA}</span><div class="poll-bar"><div class="poll-fill" style="width:${d.pctA}%"></div></div><span class="poll-pct">${d.pctA}%</span></div>
        <div class="poll-row"><span class="poll-label">${d.optB}</span><div class="poll-bar"><div class="poll-fill" style="width:${d.pctB}%"></div></div><span class="poll-pct">${d.pctB}%</span></div>
      </div>`;
    }
  }

  const singleSetHtml = postsData.map((d, i) => renderPost(d, i)).join('');
  const feedEl = document.getElementById('feed');
  feedEl.innerHTML = singleSetHtml + singleSetHtml;

  let singleSetHeight = feedEl.scrollHeight / 2;
  let clickStepPx = singleSetHeight / postsData.length;

  // ---------- milestones ----------
  const milestones = [
    { m: 2,          label: "a doorframe" },
    { m: 10,         label: "a school bus, end to end" },
    { m: 93,         label: "the Statue of Liberty" },
    { m: 330,        label: "the Eiffel Tower" },
    { m: 828,        label: "the Burj Khalifa" },
    { m: 3776,       label: "Mount Fuji" },
    { m: 8849,       label: "Mount Everest, base to peak" },
    { m: 42195,      label: "a full marathon, sideways" },
    { m: 100000,     label: "the Kármán line, the edge of space" },
    { m: 408000,     label: "higher than the ISS orbits" },
    { m: 384400000,  label: "the Moon" },
    { m: 1000000000, label: "one million kilometers. please log off." }
  ];

  // ---------- upgrades ----------
  const upgrades = [
    { id: 'thumb',       icon: icons.ghost,    color: 'var(--red)',    name: 'Ghost Scroll',      desc: '+0.1 m/s',   type: 'passive', value: 0.1,  baseCost: 15,    owned: 0, side: 'left'  },
    { id: 'click',       icon: icons.bolt,     color: 'var(--red)',    name: 'Thumbzilla',        desc: '+0.1 m/tap', type: 'click',   value: 0.1,  baseCost: 60,    owned: 0, side: 'left'  },
    { id: 'bot',         icon: icons.robot,    color: 'var(--red)',    name: 'Swipe Bot 3000',    desc: '+0.8 m/s',   type: 'passive', value: 0.8,  baseCost: 100,   owned: 0, side: 'left'  },
    { id: 'farm',        icon: icons.factory,  color: 'var(--red)',    name: 'Scroll Sweatshop',  desc: '+5 m/s',     type: 'passive', value: 5,    baseCost: 600,   owned: 0, side: 'right' },
    { id: 'ai',          icon: icons.eye,      color: 'var(--red)',    name: 'The Algorithm',     desc: '+30 m/s',    type: 'passive', value: 30,   baseCost: 4000,  owned: 0, side: 'right' },
    { id: 'singularity', icon: icons.infinity, color: '#14141a',       name: 'The Singularity',   desc: '+150 m/s',   type: 'passive', value: 150,  baseCost: 20000, owned: 0, side: 'right' }
  ];

  // ---------- state ----------
  let state = { totalDistance: 0, sp: 0, unlocked: 0, clout: 0, prestigeCount: 0 };

  function loadState() {
    try {
      const saved = JSON.parse(localStorage.getItem('doomscroll-save'));
      if (saved) {
        state.totalDistance = saved.totalDistance || 0;
        state.sp = saved.sp || 0;
        state.unlocked = saved.unlocked || 0;
        state.clout = saved.clout || 0;
        state.prestigeCount = saved.prestigeCount || 0;
        upgrades.forEach(u => { u.owned = (saved.upgrades && saved.upgrades[u.id]) || 0; });
      }
    } catch (e) {}
  }

  function saveState() {
    const upgradesOwned = {};
    upgrades.forEach(u => upgradesOwned[u.id] = u.owned);
    localStorage.setItem('doomscroll-save', JSON.stringify({
      totalDistance: state.totalDistance,
      sp: state.sp,
      unlocked: state.unlocked,
      clout: state.clout,
      prestigeCount: state.prestigeCount,
      upgrades: upgradesOwned
    }));
  }

  loadState();

  // ---------- prestige ("going viral") ----------
  function cloutMultiplier() {
    return 1 + state.clout * 0.02;
  }

  function cloutAvailable() {
    return Math.floor(Math.sqrt(state.totalDistance / 1000));
  }

  // ---------- helpers ----------
  function formatNum(n) {
    if (n < 1000) return n.toFixed(n < 10 ? 2 : 1);
    const units = ['K','M','B','T','Qa','Qi'];
    let u = -1, num = n;
    while (num >= 1000 && u < units.length - 1) { num /= 1000; u++; }
    return num.toFixed(2) + units[u];
  }

  function formatDistance(m) {
    if (m < 1000) return m.toFixed(1) + ' m';
    return formatNum(m / 1000) + ' km';
  }

  function passiveRate() {
    const base = upgrades.filter(u => u.type === 'passive').reduce((sum, u) => sum + u.value * u.owned, 0);
    return base * cloutMultiplier();
  }

  function clickPower() {
    const base = 0.15;
    const bonus = upgrades.filter(u => u.type === 'click').reduce((sum, u) => sum + u.value * u.owned, 0);
    return (base + bonus) * cloutMultiplier();
  }

  function upgradeCost(u) {
    const prestigeScale = Math.pow(1.2, state.prestigeCount);
    return Math.ceil(u.baseCost * prestigeScale * Math.pow(1.15, u.owned));
  }

  // ---------- toast ----------
  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3200);
  }

  function gain(amount) {
    if (amount <= 0) return;
    state.totalDistance += amount;
    state.sp += amount;
    checkMilestones();
  }

  function checkMilestones() {
    while (state.unlocked < milestones.length && state.totalDistance >= milestones[state.unlocked].m) {
      showToast(`you've scrolled the length of ${milestones[state.unlocked].label}.`);
      state.unlocked++;
    }
  }

  // ---------- rendering ----------
  const distanceVal = document.getElementById('distanceVal');
  const milestoneSub = document.getElementById('milestoneSub');
  const milestoneBar = document.getElementById('milestoneBar');
  const spLede = document.getElementById('spLede');
  const appsLeft = document.getElementById('appsLeft');
  const appsRight = document.getElementById('appsRight');
  const tapHint = document.getElementById('tapHint');
  const screenEl = document.getElementById('phone');
  const cloutStatus = document.getElementById('cloutStatus');
  const viralBtn = document.getElementById('viralBtn');

  function renderAppTile(u) {
    const cost = upgradeCost(u);
    const canAfford = state.sp >= cost;
    const tile = document.createElement('button');
    tile.className = 'app-item';
    tile.disabled = !canAfford;
    tile.innerHTML = `
      <div class="app-icon" style="background:${u.color}">
        ${u.icon}
      </div>
      <div class="app-text">
        <div class="app-name">${u.name}</div>
        ${u.owned > 0 ? `<div class="app-owned">owned &times;${u.owned}</div>` : ''}
        <div class="app-cost">${formatNum(cost)} pts</div>
      </div>
    `;
    tile.addEventListener('click', (e) => { e.stopPropagation(); buyUpgrade(u.id); });
    return tile;
  }

  function renderApps() {
    appsLeft.innerHTML = '';
    appsRight.innerHTML = '';
    upgrades.forEach(u => {
      const tile = renderAppTile(u);
      (u.side === 'left' ? appsLeft : appsRight).appendChild(tile);
    });
  }

  function buyUpgrade(id) {
    const u = upgrades.find(x => x.id === id);
    const cost = upgradeCost(u);
    if (state.sp < cost) return;
    state.sp -= cost;
    u.owned++;
    renderApps();
    renderStats();
    saveState();
  }

  function renderStats() {
    distanceVal.textContent = formatDistance(state.totalDistance);
    const rate = passiveRate();
    tapHint.textContent = rate > 0 ? 'scrolling itself now. tap for more.' : 'tap to scroll';
    spLede.innerHTML = `you have <b>${formatNum(state.sp)}</b> point${state.sp >= 2 ? 's' : ''} to spend`;

    if (state.unlocked < milestones.length) {
      const prev = state.unlocked === 0 ? 0 : milestones[state.unlocked - 1].m;
      const next = milestones[state.unlocked];
      const pct = Math.min(100, ((state.totalDistance - prev) / (next.m - prev)) * 100);
      milestoneSub.textContent = `next up: ${next.label}`;
      milestoneBar.style.width = pct + '%';
    } else {
      milestoneSub.textContent = 'every milestone unlocked.';
      milestoneBar.style.width = '100%';
    }

    const boostPct = Math.round((cloutMultiplier() - 1) * 100);
    const available = cloutAvailable();
    cloutStatus.innerHTML = boostPct > 0
      ? `<b>${formatNum(state.clout)}</b> clout &middot; scrolling ${boostPct}% faster forever`
      : `${formatNum(state.clout)} clout &middot; scrolling at normal speed`;
    viralBtn.disabled = available < 1;
    viralBtn.classList.toggle('ready', available >= 1);
    viralBtn.textContent = 'go viral';
    if (available >= 1) {
      viralBtn.style.removeProperty('--glow');
      viralBtn.style.removeProperty('--spread');
    } else {
      const progress = Math.min(1, state.totalDistance / 1000);
      viralBtn.style.setProperty('--glow', (progress * 0.55).toFixed(2));
      viralBtn.style.setProperty('--spread', (progress * 8).toFixed(1) + 'px');
    }
  }

  function goViral() {
    const gained = cloutAvailable();
    if (gained < 1) return;
    state.clout += gained;
    state.prestigeCount += 1;
    state.totalDistance = 0;
    state.sp = 0;
    state.unlocked = 0;
    upgrades.forEach(u => u.owned = 0);
    feedOffset = 0;
    applyFeedTransform();
    renderStats();
    renderApps();
    saveState();
    showToast(`you went viral. +${gained} clout, forever.`);
  }

  // ---------- feed motion ----------
  let feedOffset = 0;
  const FEED_SCALE = 26;

  function applyFeedTransform() {
    const wrapped = feedOffset % singleSetHeight;
    feedEl.style.transform = `translateY(-${wrapped}px)`;
  }

  function spawnRipple(x, y) {
    const power = clickPower();
    const size = 26 + power * 170;
    const ripple = document.createElement('div');
    ripple.className = 'tap-ripple';
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    ripple.style.width = size + 'px';
    ripple.style.height = size + 'px';
    screenEl.appendChild(ripple);
    requestAnimationFrame(() => ripple.classList.add('pop'));
    setTimeout(() => ripple.remove(), 550);
  }

  screenEl.addEventListener('click', (e) => {
    const rect = screenEl.getBoundingClientRect();
    spawnRipple(e.clientX - rect.left, e.clientY - rect.top);

    gain(clickPower());
    feedOffset += clickStepPx;
    applyFeedTransform();
    renderStats();
    renderApps();
  });

  let lastTick = performance.now();
  function loop(now) {
    const dt = (now - lastTick) / 1000;
    lastTick = now;
    const rate = passiveRate();
    if (rate > 0) {
      gain(rate * dt);
      feedOffset += rate * FEED_SCALE * dt;
      applyFeedTransform();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  setInterval(() => { renderStats(); renderApps(); saveState(); }, 500);
  window.addEventListener('beforeunload', saveState);

  viralBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    goViral();
  });

  // ---------- ambient particles ----------
  const particleContainer = document.getElementById('bgParticles');
  for (let i = 0; i < 40; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const leftSide = Math.random() < 0.5;
    const pos = leftSide ? Math.random() * 30 : 70 + Math.random() * 30;
    p.style.left = pos + '%';
    const size = 2 + Math.random() * 3;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.animationDuration = (14 + Math.random() * 16) + 's';
    p.style.animationDelay = (Math.random() * 20) + 's';
    if (Math.random() > 0.6) p.style.background = 'var(--gold)';
    particleContainer.appendChild(p);
  }

  // ---------- init ----------
  checkMilestones();
  applyFeedTransform();
  renderStats();
  renderApps();

  // ---------- scale the whole composition to fit any window ----------
  const fitWrapper = document.querySelector('.stage-panel');
  function fitToScreen() {
    fitWrapper.style.transform = 'scale(1)';
    const rect = fitWrapper.getBoundingClientRect();
    const margin = 40;
    const scaleX = (window.innerWidth - margin * 2) / rect.width;
    const scaleY = (window.innerHeight - margin * 2) / rect.height;
    const scale = Math.min(scaleX, scaleY, 1.9);
    fitWrapper.style.transform = `scale(${scale})`;
  }
  window.addEventListener('resize', fitToScreen);
  window.addEventListener('orientationchange', fitToScreen);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(fitToScreen);
  }
  fitToScreen();
</script>

</body>
</html>
