<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>π — Weird Little Games</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232a1e3d'/%3E%3Ctext x='16' y='24' font-family='Georgia, serif' font-weight='700' font-size='24' fill='%23ff5a1f' text-anchor='middle'%3E%CF%80%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #fbeae4;
    --ink: #23201d;
    --ink-dim: #766f68;
    --orange: #ff5a1f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--pink);
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    padding: 90px 24px 200px;
  }
  a { color: inherit; text-decoration: none; }

  .corner-badge {
    position: fixed;
    top: 55px;
    left: 26px;
    z-index: 50;
    transform: rotate(-25deg);
    transform-origin: top left;
    text-align: center;
    color: var(--ink);
    text-decoration: underline;
    font-family: 'Pacifico', cursive;
    font-weight: 400;
    font-size: 40px;
    line-height: 1.05;
    transition: color 0.15s ease;
  }
  .corner-badge:hover { animation: badgeWobble 1.6s ease; color: var(--orange); }
  @media (max-width: 960px) {
    /* on a long scrolling page like this one, a position:fixed badge
       stays glued to the same spot on screen and ends up overlapping
       whatever digits happen to be there once you scroll -- switching
       to absolute lets it scroll away with the top of the page instead */
    .corner-badge { position: absolute; top: 14px; left: 14px; font-size: 22px; }
  }

  .scroll-top-btn {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translate(-50%, 20px);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 2.5px solid var(--ink);
    background: #fff;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 3px 3px 0 rgba(35,32,29,0.16);
    z-index: 60;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .scroll-top-btn.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
  @keyframes badgeWobble {
    0%, 100% { transform: rotate(-25deg); }
    15% { transform: rotate(-12deg); }
    30% { transform: rotate(-36deg); }
    45% { transform: rotate(-16deg); }
    60% { transform: rotate(-32deg); }
    75% { transform: rotate(-21deg); }
    90% { transform: rotate(-27deg); }
  }

  .digits {
    max-width: 1000px;
    margin: 0 auto;
    font-size: clamp(28px, 5vw, 46px);
    font-weight: 500;
    line-height: 1.6;
    word-break: break-all;
    color: var(--ink);
  }
</style>
</head>
<body>

<a class="corner-badge" href="../../index.html">Weird<br>Little<br>Games.</a>

<div class="digits" id="digits">3.</div>

<button class="scroll-top-btn" id="scrollTopBtn" title="back to top" aria-label="scroll to top">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 19V5"/>
    <path d="M5 12l7-7 7 7"/>
  </svg>
</button>

<script>
  // ---------- unbounded spigot algorithm for the digits of pi ----------
  // (Gibbons, "Unbounded Spigot Algorithms for the Digits of Pi", 2004)
  // generates true digits one at a time using arbitrary-precision
  // integers (BigInt) -- not a fixed hardcoded string, so it never
  // runs out and never repeats. it does get slower the further out it
  // goes, since the integers involved keep growing.
  function makePiGenerator() {
    var q = 1n, r = 0n, t = 1n, k = 1n, n = 3n, l = 3n;
    return function nextDigit() {
      while (true) {
        if (4n * q + r - t < n * t) {
          var digit = n;
          var nq = 10n * q;
          var nr = 10n * (r - n * t);
          var nn = (10n * (3n * q + r)) / t - 10n * n;
          q = nq; r = nr; n = nn;
          return digit;
        } else {
          var nq2 = q * k;
          var nr2 = (2n * q + r) * l;
          var nt2 = t * l;
          var nn2 = (q * (7n * k + 2n) + r * l) / (t * l);
          q = nq2; r = nr2; t = nt2; k = k + 1n; n = nn2; l = l + 2n;
        }
      }
    };
  }

  var nextDigit = makePiGenerator();
  nextDigit(); // discard the leading "3" -- already shown in the markup

  var digitsEl = document.getElementById('digits');
  var BATCH = 400;
  var generating = false;

  function generateBatch() {
    if (generating) return;
    generating = true;
    // spread the work across a couple of frames so a big batch doesn't
    // freeze the tab, especially once digits get expensive to compute
    var out = [];
    var i = 0;
    function chunk() {
      var end = Math.min(i + 50, BATCH);
      for (; i < end; i++) out.push(nextDigit().toString());
      if (i < BATCH) {
        requestAnimationFrame(chunk);
      } else {
        digitsEl.textContent += out.join('');
        generating = false;
      }
    }
    chunk();
  }

  // a plain scroll-position check instead of IntersectionObserver -- the
  // observer only fires on enter/exit transitions, so once the page grows
  // taller than the viewport but the sentinel just sits there continuously
  // in range, it never fires again and generation silently stalls.
  function nearBottom() {
    return window.innerHeight + window.scrollY >= document.body.offsetHeight - 800;
  }
  function checkScroll() {
    if (nearBottom()) generateBatch();
  }
  window.addEventListener('scroll', checkScroll);
  window.addEventListener('resize', checkScroll);

  generateBatch();
  // the first batch or two might not be enough to make the page
  // scrollable at all -- keep topping it up until it is.
  var fillInterval = setInterval(function () {
    if (document.body.offsetHeight > window.innerHeight * 1.5) {
      clearInterval(fillInterval);
    } else if (!generating) {
      generateBatch();
    }
  }, 50);

  // ---------- back-to-top button ----------
  // only worth showing once you're far enough down that scrolling back
  // up would actually take a while, and only once you've actually
  // committed to scrolling up for a couple seconds (not just a stray
  // flick), so it doesn't pop in and out on every little wiggle.
  (function () {
    var scrollTopBtn = document.getElementById('scrollTopBtn');
    var lastY = window.scrollY;
    var upScrollStart = null;
    var ticking = false;
    var FAR_DOWN = window.innerHeight * 1.5;
    var HOLD_MS = 1000;

    function evaluateScroll() {
      var y = window.scrollY;
      if (y < lastY - 1) {
        if (upScrollStart === null) upScrollStart = Date.now();
        if (y > FAR_DOWN && Date.now() - upScrollStart >= HOLD_MS) {
          scrollTopBtn.classList.add('show');
        }
      } else if (y > lastY + 1) {
        upScrollStart = null;
        scrollTopBtn.classList.remove('show');
      }
      if (y <= FAR_DOWN) scrollTopBtn.classList.remove('show');
      lastY = y;
      ticking = false;
    }
    window.addEventListener('scroll', function () {
      if (!ticking) { ticking = true; requestAnimationFrame(evaluateScroll); }
    }, { passive: true });

    scrollTopBtn.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
      scrollTopBtn.classList.remove('show');
      upScrollStart = null;
    });
  })();
</script>
</body>
</html>
