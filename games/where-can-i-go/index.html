<style>
  :root {
    --sky: #dff1f9;
    --sky-deep: #c9e6f2;
    --ink: #23201d;
    --ink-dim: #4e5f66;
    --card-bg: #ffffff;
    --orange: #ff5a1f;
    --red: #ff2d55;
    --teal: #1f8a70;
    --navy: #1c4f66;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--sky);
    background-image: radial-gradient(circle, rgba(28,79,102,0.06) 1px, transparent 1px);
    background-size: 26px 26px;
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    padding: 32px 18px 80px;
  }
  h1, .display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; font-weight: 400; }
  a { color: inherit; text-decoration: none; }

  .corner-badge {
    position: fixed;
    top: 55px;
    left: 26px;
    z-index: 50;
    transform: rotate(-25deg);
    transform-origin: top left;
    text-align: center;
    color: var(--ink);
    text-decoration: underline;
    font-family: 'Pacifico', cursive;
    font-weight: 400;
    font-size: 40px;
    line-height: 1.05;
    transition: color 0.15s ease;
  }
  .corner-badge:hover { animation: badgeWobble 1.6s ease; color: var(--orange); }
  @keyframes badgeWobble {
    0%, 100% { transform: rotate(-25deg); }
    15% { transform: rotate(-12deg); }
    30% { transform: rotate(-36deg); }
    45% { transform: rotate(-16deg); }
    60% { transform: rotate(-32deg); }
    75% { transform: rotate(-21deg); }
    90% { transform: rotate(-27deg); }
  }

  .wrap { max-width: 540px; margin: 0 auto; text-align: center; }

  h1 { font-size: clamp(2.2rem, 7vw, 3rem); margin: 10px 0 2px; }
  h1 span { color: var(--orange); }
  .tagline { font-size: 0.85rem; color: var(--ink-dim); margin: 0 0 26px; }

  .step { display: none; }
  .step.show { display: block; }

  .card {
    background: var(--card-bg);
    border: 3px solid var(--ink);
    border-radius: 20px;
    padding: 22px 24px;
    box-shadow: 5px 6px 0 rgba(28,79,102,0.16);
    margin-bottom: 18px;
    text-align: left;
  }
  .card h2 { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; margin: 0 0 14px; text-align: center; }

  .budget-amount {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3rem;
    color: var(--orange);
    margin-bottom: 4px;
    text-align: center;
  }
  .budget-input-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .budget-input-row input[type="number"] {
    width: 110px;
    font-family: 'DM Mono', monospace;
    font-size: 0.95rem;
    padding: 8px 10px;
    border: 2px solid var(--ink);
    border-radius: 10px;
    text-align: center;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--orange);
    margin-bottom: 6px;
  }
  .slider-labels {
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    color: var(--ink-dim);
    margin-bottom: 4px;
  }

  .btn {
    display: block;
    width: 100%;
    background: var(--orange);
    color: #fff;
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 12px;
    font-size: 0.95rem;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
    margin-top: 14px;
  }
  .btn:hover { background: var(--red); transform: translateY(-2px); }
  .btn.secondary { background: var(--card-bg); color: var(--ink); }
  .btn.secondary:hover { background: var(--sky-deep); color: var(--ink); }

  .field-label { font-size: 0.78rem; color: var(--ink-dim); margin: 14px 0 6px; }
  .field-label:first-child { margin-top: 0; }
  select {
    width: 100%;
    font-family: 'DM Mono', monospace;
    font-size: 0.95rem;
    padding: 12px 12px;
    border: 2.5px solid var(--ink);
    border-radius: 12px;
    background: var(--card-bg);
    color: var(--ink);
    cursor: pointer;
  }

  .switch-link {
    display: block;
    margin: 18px auto 0;
    background: none; border: none; text-decoration: underline;
    color: var(--ink-dim); font-family: 'DM Mono', monospace; font-size: 0.8rem;
    cursor: pointer; padding: 0;
  }
  .switch-link:hover { color: var(--orange); }

  .dest-card { text-align: left; }
  .dest-label { font-size: 0.75rem; color: var(--ink-dim); margin-bottom: 2px; }
  .dest-name { font-family: 'Bebas Neue', sans-serif; font-size: 1.7rem; margin-bottom: 4px; }
  .dest-line { font-size: 0.82rem; color: var(--ink-dim); margin-bottom: 12px; font-style: italic; }
  .fit-tag {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .fit-tag.yes { background: #dcf3e6; color: var(--teal); }
  .fit-tag.no { background: #ffe1e6; color: var(--red); }

  table.breakdown { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
  table.breakdown td { padding: 6px 0; border-bottom: 1.5px dashed var(--sky-deep); }
  table.breakdown td:last-child { text-align: right; font-weight: 500; }
  table.breakdown tr:last-child td { border-bottom: none; font-weight: 600; }
  table.breakdown tr:last-child td.fits { color: var(--teal); }
  table.breakdown tr:last-child td.short { color: var(--red); }

  .empty-card p, .noairport-card p { margin: 0 0 4px; font-size: 0.88rem; color: var(--ink-dim); }
  .noairport-card .big { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; margin-bottom: 8px; text-align: center; }

  .joke-card .big { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; margin-bottom: 8px; text-align: center; }
  .joke-card p { margin: 0 0 4px; font-size: 0.9rem; color: var(--ink-dim); }
  .joke-card .big { text-align: center; }

<div class="wrap">

  <a class="corner-badge" href="../../index.html">Weird<br>Little<br>Games.</a>
  <h1>Where Can I <span>Go?</span></h1>
  <p class="tagline">not a real booking tool. just typical-cost guesswork with attitude.</p>

  <!-- step 1: budget -->
  <div class="step show" id="stepBudget">
    <div class="card">
      <h2>how far can your money take you?</h2>
      <div class="budget-amount" id="budgetAmount">$1,000</div>
      <div class="budget-input-row">
        <span>$</span>
        <input type="number" id="budgetInput" min="20" max="10000" step="10" value="1000">
      </div>
      <input type="range" id="budgetSlider" min="20" max="10000" step="10" value="1000">
      <div class="slider-labels">
        <span>$20</span>
        <span>$5,000</span>
        <span>$10,000</span>
      </div>
      <button class="btn" id="toPickerBtn">next</button>
    </div>
  </div>

  <!-- step 2: departure + destination pickers -->
  <div class="step" id="stepPicker">
    <div class="card">
      <h2>where from, where to?</h2>

      <div class="field-label">leaving from</div>
      <select id="departureSelect">
        <option value="surprise">Surprise me (random everything)</option>
      </select>

      <div class="field-label">going to</div>
      <select id="destinationSelect">
        <option value="surprise">Surprise me (pick something that fits)</option>
      </select>

      <button class="btn" id="goBtn">go</button>
    </div>
  </div>

  <!-- step 3: results -->
  <div class="step" id="stepResults">
    <div id="resultsBody"></div>
    <button class="switch-link" id="startOverBtn">start over</button>
  </div>

</div>

<script>
  // ---------- step navigation ----------
  var steps = {
    budget: document.getElementById('stepBudget'),
    picker: document.getElementById('stepPicker'),
    results: document.getElementById('stepResults')

  function showStep(name) {
    Object.keys(steps).forEach(function (k) { steps[k].classList.toggle('show', k === name); });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function formatMoney(n) {
    return '$' + Math.round(n).toLocaleString('en-US');
  }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // ---------- step 1: budget ----------
  var budgetInput = document.getElementById('budgetInput');
  var budgetSlider = document.getElementById('budgetSlider');
  var budgetAmount = document.getElementById('budgetAmount');
  var trip = { budget: 1000 };

  function syncFromSlider() {
    budgetInput.value = budgetSlider.value;
    budgetAmount.textContent = formatMoney(budgetSlider.value);
  }
  function syncFromInput() {
    var v = Math.max(20, Math.min(10000, parseInt(budgetInput.value, 10) || 20));
    budgetSlider.value = v;
    budgetAmount.textContent = formatMoney(v);
  }
  budgetSlider.addEventListener('input', syncFromSlider);
  budgetInput.addEventListener('input', syncFromInput);

    { max: 69, lines: ['You could technically afford a motel room for a few hours.', 'We are not going to ask why. Neither is the front desk clerk, for a fee.'] },
    { max: 79, lines: ['One night at a truly mediocre motel is now within reach.', 'The ice machine will be broken. It is always broken. This is the rule.'] },
    { max: 89, lines: ['A full day trip: gas, one real meal, and a keychain you absolutely did not need.', 'You\'re one Groupon away from thinking you\'re a world traveler.'] },
    { max: 99, lines: ['You are one skipped meal away from actually affording a real trip.', 'Go check the couch cushions. We believe in you, barely.'] }

  function jokeCardHTML(budget) {
    var tier = jokeTiers[jokeTiers.length - 1];
    for (var i = 0; i < jokeTiers.length; i++) {
      if (budget <= jokeTiers[i].max) { tier = jokeTiers[i]; break; }

      '<div class="card joke-card">' +
        '<div class="big">' + formatMoney(budget) + '</div>' +
        '<p style="text-align:center">Congratulations.</p>' +
        tier.lines.map(function (line) { return '<p style="text-align:center">' + line + '</p>'; }).join('') +

    ['Australia', 11, 3, 'Canberra', 'AU'], ['New Zealand', 11, 3, 'Wellington', 'NZ'], ['Papua New Guinea', 11, 1, 'Port Moresby', 'PG'],
    ['Fiji', 11, 2, 'Suva', 'FJ'], ['Solomon Islands', 11, 1, 'Honiara', 'SB'], ['Vanuatu', 11, 2, 'Port Vila', 'VU'],
    ['Samoa', 11, 2, 'Apia', 'WS'], ['Tonga', 11, 2, "Nuku'alofa", 'TO'], ['Kiribati', 11, 1, 'Tarawa', 'KI'],
    ['Tuvalu', 11, 1, 'Funafuti', 'TV'], ['Nauru', 11, 1, 'Yaren', 'NR'], ['Palau', 11, 2, 'Ngerulmud', 'PW'],
    ['Micronesia', 11, 1, 'Palikir', 'FM'], ['Marshall Islands', 11, 1, 'Majuro', 'MH']
  ];

  var NO_AIRPORT = [
    { name: 'Vatican City', isoCode: 'VA', line: 'Vatican City does not have an international airport. It is 0.17 square miles. You would overshoot the runway into Rome.' },
    { name: 'Monaco', isoCode: 'MC', line: 'Monaco does not have an international airport. It has a heliport, and a helicopter is not in this budget, or possibly any budget.' },
    { name: 'San Marino', isoCode: 'SM', line: 'San Marino does not have an international airport. You would fly into Italy and drive up a mountain, which defeats the point of picking San Marino.' },
    { name: 'Andorra', isoCode: 'AD', line: 'Andorra does not have an international airport. It is famously reachable by "a very long bus ride from somewhere else."' },
    { name: 'Liechtenstein', isoCode: 'LI', line: 'Liechtenstein does not have an international airport. It does not even have a regular one. You are flying into Zurich and driving.' }
  ];

  var countries = countryData.map(function (c) {
    return { name: c[0], zone: c[1], tier: c[2], city: c[3], isoCode: c[4], noAirport: false };
  });
  NO_AIRPORT.forEach(function (na) {
    countries.push({ name: na.name, isoCode: na.isoCode, noAirport: true, line: na.line });
  });
  countries.sort(function (a, b) { return a.name.localeCompare(b.name); });

  var flyableCountries = countries.filter(function (c) { return !c.noAirport; });

  // ---------- populate the two selects ----------
  var departureSelect = document.getElementById('departureSelect');
  var destinationSelect = document.getElementById('destinationSelect');
  countries.forEach(function (c) {
    var opt1 = document.createElement('option');
    opt1.value = c.name;
    opt1.textContent = c.name + (c.noAirport ? ' (no international airport)' : '');
    departureSelect.appendChild(opt1);

    var opt2 = document.createElement('option');
    opt2.value = c.name;
    opt2.textContent = c.name + (c.noAirport ? ' (no international airport)' : '');
    destinationSelect.appendChild(opt2);
  });

  function findCountry(name) {
    for (var i = 0; i < countries.length; i++) { if (countries[i].name === name) return countries[i]; }
    return null;
  }

  // ---------- cost estimate ----------
  function flightCost(depZone, destZone) {
    var diff = Math.abs(ZONE_ORDER[depZone] - ZONE_ORDER[destZone]);
    return Math.round(180 + diff * 160);
  }
  function estimateTrip(dep, dest) {
    var rates = TIER_RATES[dest.tier];
    var flight = dep.zone === dest.zone ? Math.round(flightCost(dep.zone, dest.zone) * 0.6) : flightCost(dep.zone, dest.zone);
    var hotel = rates.hotel * NIGHTS;
    var food = rates.food * NIGHTS;
    var activities = rates.activities * NIGHTS;
    var transport = rates.transport * NIGHTS;
    return {
      flight: flight, hotel: hotel, food: food, activities: activities, transport: transport,
      total: flight + hotel + food + activities + transport, nights: NIGHTS
    };
  }

  var destLines = [
    'A real place. A real estimate. Emotionally, still made up.',
    'This is what typical costs look like. Your actual mileage, and meltdowns, may vary.',
    'Somewhere on Earth, for a somewhat realistic price.',
    'This could genuinely be a trip. Wild.',
    'A destination with an actual airport. We checked. Mostly.'
  ];

  function noAirportCardHTML(country) {
    return (
      '<div class="card noairport-card">' +
        '<div class="big">' + country.name + '</div>' +
        '<p>' + country.line + '</p>' +
        '<p>Pick somewhere with a runway.</p>' +
      '</div>'
    );
  }

  function tripCardHTML(dep, dest) {
    var c = estimateTrip(dep, dest);
    var fits = c.total <= trip.budget;
    var left = trip.budget - c.total;
    return (
      '<div class="card dest-card">' +
        '<div class="dest-label">flying from ' + dep.name + ' (' + dep.city + ')</div>' +
        '<div class="dest-name">' + dest.name + '</div>' +
        '<div class="dest-line">' + pick(destLines) + '</div>' +
        '<span class="fit-tag ' + (fits ? 'yes' : 'no') + '">' + (fits ? 'fits your budget' : 'does not fit your budget') + '</span>' +
        '<table class="breakdown">' +
          '<tr><td>Flight (estimate)</td><td>' + formatMoney(c.flight) + '</td></tr>' +
          '<tr><td>Hotel — ' + c.nights + ' nights</td><td>' + formatMoney(c.hotel) + '</td></tr>' +
          '<tr><td>Food</td><td>' + formatMoney(c.food) + '</td></tr>' +
          '<tr><td>Local transportation</td><td>' + formatMoney(c.transport) + '</td></tr>' +
          '<tr><td>Activities</td><td>' + formatMoney(c.activities) + '</td></tr>' +
          '<tr><td>Total estimate</td><td>' + formatMoney(c.total) + '</td></tr>' +
          '<tr><td>' + (fits ? 'Left over' : 'You are short') + '</td><td class="' + (fits ? 'fits' : 'short') + '">' + formatMoney(Math.abs(left)) + '</td></tr>' +
        '</table>' +
      '</div>'
    );
  }

  function pickRandomFlyable(exclude) {
    var pool = flyableCountries.filter(function (c) { return c.name !== exclude; });
    return pick(pool);
  }

  // try a handful of random affordable pairs before giving up and just
  // showing the cheapest possible pairing, so "surprise me" still respects
  // the budget instead of being purely random.
  function findAffordablePair(depFixed, destFixed) {
    var attempts = 60;
    for (var i = 0; i < attempts; i++) {
      var dep = depFixed || pickRandomFlyable(destFixed ? destFixed.name : null);
      var dest = destFixed || pickRandomFlyable(dep.name);
      if (dep.name === dest.name) continue;
      if (estimateTrip(dep, dest).total <= trip.budget) return { dep: dep, dest: dest };
    }
    // nothing affordable found -- fall back to the cheapest possible pair
    // so the game is still honest instead of silently failing
    var best = null, bestTotal = Infinity;
    var depsToTry = depFixed ? [depFixed] : flyableCountries;
    var destsToTry = destFixed ? [destFixed] : flyableCountries;
    depsToTry.forEach(function (d) {
      destsToTry.forEach(function (t) {
        if (d.name === t.name) return;
        var total = estimateTrip(d, t).total;
        if (total < bestTotal) { bestTotal = total; best = { dep: d, dest: t }; }
      });
    });
    return best;
  }

  document.getElementById('goBtn').addEventListener('click', function () {
    var depName = departureSelect.value;
    var destName = destinationSelect.value;
    var body = document.getElementById('resultsBody');

    var depSurprise = depName === 'surprise';
    var destSurprise = destName === 'surprise';

    var depCountry = depSurprise ? null : findCountry(depName);
    var destCountry = destSurprise ? null : findCountry(destName);

    if (depCountry && depCountry.noAirport) { body.innerHTML = noAirportCardHTML(depCountry); showStep('results'); return; }
    if (destCountry && destCountry.noAirport) { body.innerHTML = noAirportCardHTML(destCountry); showStep('results'); return; }

    if (!depSurprise && !destSurprise && depCountry.name === destCountry.name) {
      body.innerHTML = '<div class="card empty-card"><h2>that is not a trip.</h2><p>Leaving from ' + depCountry.name + ' to go to ' + destCountry.name + ' is just staying home with extra steps.</p></div>';
      showStep('results');
      return;
    }

    var pair = findAffordablePair(
      depSurprise ? null : depCountry,
      destSurprise ? null : destCountry
    );
    body.innerHTML = tripCardHTML(pair.dep, pair.dest);
    showStep('results');
  });

  document.getElementById('startOverBtn').addEventListener('click', function () {
    showStep('budget');
  });
</script>
</body>
</html>
