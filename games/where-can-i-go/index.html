<style>
  :root {
    --sky: #dff1f9;
    --sky-deep: #c9e6f2;
    --ink: #23201d;
    --ink-dim: #4e5f66;
    --card-bg: #ffffff;
    --orange: #ff5a1f;
    --red: #ff2d55;
    --teal: #1f8a70;
    --navy: #1c4f66;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--sky);
    background-image: radial-gradient(circle, rgba(28,79,102,0.06) 1px, transparent 1px);
    background-size: 26px 26px;
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    padding: 32px 18px 80px;
  }
  h1, .display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; font-weight: 400; }
  a { color: inherit; text-decoration: none; }

  .corner-badge {
    position: fixed;
    top: 55px;
    left: 26px;
    z-index: 50;
    transform: rotate(-25deg);
    transform-origin: top left;
    text-align: center;
    color: var(--ink);
    text-decoration: underline;
    font-family: 'Pacifico', cursive;
    font-weight: 400;
    font-size: 40px;
    line-height: 1.05;
    transition: color 0.15s ease;
  }
  .corner-badge:hover { animation: badgeWobble 1.6s ease; color: var(--orange); }
  @media (max-width: 960px) {
    .corner-badge { top: 14px; left: 14px; font-size: 22px; }
    body { padding-top: 90px; }
  }
  @keyframes badgeWobble {
    0%, 100% { transform: rotate(-25deg); }
    15% { transform: rotate(-12deg); }
    30% { transform: rotate(-36deg); }
    45% { transform: rotate(-16deg); }
    60% { transform: rotate(-32deg); }
    75% { transform: rotate(-21deg); }
    90% { transform: rotate(-27deg); }
  }

  .wrap { max-width: 540px; margin: 0 auto; text-align: center; }

  h1 { font-size: clamp(2.2rem, 7vw, 3rem); margin: 10px 0 2px; }
  h1 span { color: var(--orange); }
  .tagline { font-size: 0.85rem; color: var(--ink-dim); margin: 0 0 26px; }

  .step { display: none; }
  .step.show { display: block; }

  .card {
    background: var(--card-bg);
    border: 3px solid var(--ink);
    border-radius: 20px;
    padding: 22px 24px;
    box-shadow: 5px 6px 0 rgba(28,79,102,0.16);
    margin-bottom: 18px;
    text-align: left;
  }
  .card h2 { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; margin: 0 0 14px; text-align: center; }

  .budget-amount {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3rem;
    color: var(--orange);
    margin-bottom: 4px;
    text-align: center;
  }
  .budget-input-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .budget-input-row input[type="number"] {
    width: 110px;
    font-family: 'DM Mono', monospace;
    font-size: 0.95rem;
    padding: 8px 10px;
    border: 2px solid var(--ink);
    border-radius: 10px;
    text-align: center;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--orange);
    margin-bottom: 6px;
  }
  .slider-labels {
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    color: var(--ink-dim);
    margin-bottom: 4px;
  }

  .btn {
    display: block;
    width: 100%;
    background: var(--orange);
    color: #fff;
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 12px;
    font-size: 0.95rem;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
    margin-top: 14px;
  }
  .btn:hover { background: var(--red); transform: translateY(-2px); }
  .btn.secondary { background: var(--card-bg); color: var(--ink); }
  .btn.secondary:hover { background: var(--sky-deep); color: var(--ink); }

  .field-label { font-size: 0.78rem; color: var(--ink-dim); margin: 14px 0 6px; }
  .field-label:first-child { margin-top: 0; }
  select, input[type="text"] {
    width: 100%;
    font-family: 'DM Mono', monospace;
    font-size: 0.95rem;
    padding: 12px 12px;
    border: 2.5px solid var(--ink);
    border-radius: 12px;
    background: var(--card-bg);
    color: var(--ink);
    cursor: pointer;
  }
  input[type="text"] { cursor: text; font-size: 16px; }
  input[type="text"]:focus { outline: none; border-color: var(--orange); }

  .switch-link {
    display: block;
    margin: 18px auto 0;
    background: none; border: none; text-decoration: underline;
    color: var(--ink-dim); font-family: 'DM Mono', monospace; font-size: 0.8rem;
    cursor: pointer; padding: 0;
  }
  .switch-link:hover { color: var(--orange); }

  .dest-card { text-align: left; }
  .dest-label { font-size: 0.75rem; color: var(--ink-dim); margin-bottom: 2px; }
  .dest-name { font-family: 'Bebas Neue', sans-serif; font-size: 1.7rem; margin-bottom: 4px; }
  .dest-line { font-size: 0.82rem; color: var(--ink-dim); margin-bottom: 12px; font-style: italic; }
  .fit-tag {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .fit-tag.yes { background: #dcf3e6; color: var(--teal); }
  .fit-tag.no { background: #ffe1e6; color: var(--red); }

  table.breakdown { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
  table.breakdown td { padding: 6px 0; border-bottom: 1.5px dashed var(--sky-deep); }
  table.breakdown td:last-child { text-align: right; font-weight: 500; }
  table.breakdown tr:last-child td { border-bottom: none; font-weight: 600; }
  table.breakdown tr:last-child td.fits { color: var(--teal); }
  table.breakdown tr:last-child td.short { color: var(--red); }

  .empty-card p, .noairport-card p { margin: 0 0 4px; font-size: 0.88rem; color: var(--ink-dim); }
  .noairport-card .big { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; margin-bottom: 8px; text-align: center; }

  .joke-card .big { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; margin-bottom: 8px; text-align: center; }
  .joke-card p { margin: 0 0 4px; font-size: 0.9rem; color: var(--ink-dim); }
  .joke-card .big { text-align: center; }
</style>
</head>
<body>
<div class="wrap">

  <a class="corner-badge" href="../../index.html">Weird<br>Little<br>Games.</a>
  <h1>Where Can I <span>Go?</span></h1>
  <p class="tagline">not a real booking tool. just typical-cost guesswork with attitude.</p>

  <!-- step 1: budget -->
  <div class="step show" id="stepBudget">
    <div class="card">
      <h2>how far can your money take you?</h2>
      <div class="budget-amount" id="budgetAmount">$1,000</div>
      <div class="budget-input-row">
        <span>$</span>
        <input type="number" id="budgetInput" min="20" max="10000" step="10" value="1000">
      </div>
      <input type="range" id="budgetSlider" min="20" max="10000" step="10" value="1000">
      <div class="slider-labels">
        <span>$20</span>
        <span>$5,000</span>
        <span>$10,000</span>
      </div>
      <button class="btn" id="toPickerBtn">next</button>
    </div>
  </div>

  <!-- step 2: departure + destination pickers -->
  <div class="step" id="stepPicker">
    <div class="card">
      <h2>where from, where to?</h2>

      <div class="field-label">leaving from</div>
      <input type="text" id="departureInput" list="departureOptions" placeholder="type a country, or 'surprise me'" autocomplete="off">
      <datalist id="departureOptions"></datalist>

      <div class="field-label">going to</div>
      <input type="text" id="destinationInput" list="destinationOptions" placeholder="type a country, or 'surprise me'" autocomplete="off">
      <datalist id="destinationOptions"></datalist>

      <button class="btn" id="goBtn">go</button>
    </div>
  </div>

  <!-- step 3: results -->
  <div class="step" id="stepResults">
    <div id="resultsBody"></div>
    <button class="switch-link" id="startOverBtn">start over</button>
  </div>

</div>

<script>
  // ---------- step navigation ----------
  var steps = {
    budget: document.getElementById('stepBudget'),
    picker: document.getElementById('stepPicker'),
    results: document.getElementById('stepResults')
  };
  function showStep(name) {
    Object.keys(steps).forEach(function (k) { steps[k].classList.toggle('show', k === name); });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function formatMoney(n) {
    return '$' + Math.round(n).toLocaleString('en-US');
  }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  // ---------- step 1: budget ----------
  var budgetInput = document.getElementById('budgetInput');
  var budgetSlider = document.getElementById('budgetSlider');
  var budgetAmount = document.getElementById('budgetAmount');
  var trip = { budget: 1000 };

  function syncFromSlider() {
    budgetInput.value = budgetSlider.value;
    budgetAmount.textContent = formatMoney(budgetSlider.value);
  }
  function syncFromInput() {
    var v = Math.max(20, Math.min(10000, parseInt(budgetInput.value, 10) || 20));
    budgetSlider.value = v;
    budgetAmount.textContent = formatMoney(v);
  }
  budgetSlider.addEventListener('input', syncFromSlider);
  budgetInput.addEventListener('input', syncFromInput);

  var jokeTiers = [
    { max: 29, lines: ['You can visit the nearest city and buy lunch.', 'This is not a vacation. This is an errand with a worse mood.'] },
    { max: 39, lines: ['You can afford lunch AND a small dessert.', 'Truly the Rockefeller of getting a Wendy\'s Frosty.'] },
    { max: 49, lines: ['You can drive two towns over for a real sit-down lunch.', 'Ambitious of you to call this a "trip" and not "running an errand in a different zip code."'] },
    { max: 59, lines: ['You can drive somewhere with a nice view, park, and eat a sandwich looking at it.', 'Congratulations on inventing the saddest possible picnic.'] },
    { max: 69, lines: ['You could technically afford a motel room for a few hours.', 'We are not going to ask why. Neither is the front desk clerk, for a fee.'] },
    { max: 79, lines: ['One night at a truly mediocre motel is now within reach.', 'The ice machine will be broken. It is always broken. This is the rule.'] },
    { max: 89, lines: ['A full day trip: gas, one real meal, and a keychain you absolutely did not need.', 'You\'re one Groupon away from thinking you\'re a world traveler.'] },
    { max: 99, lines: ['You are one skipped meal away from actually affording a real trip.', 'Go check the couch cushions. We believe in you, barely.'] }
  ];
  function jokeCardHTML(budget) {
    var tier = jokeTiers[jokeTiers.length - 1];
    for (var i = 0; i < jokeTiers.length; i++) {
      if (budget <= jokeTiers[i].max) { tier = jokeTiers[i]; break; }
    }
    return (
      '<div class="card joke-card">' +
        '<div class="big">' + formatMoney(budget) + '</div>' +
        '<p style="text-align:center">Congratulations.</p>' +
        tier.lines.map(function (line) { return '<p style="text-align:center">' + line + '</p>'; }).join('') +
      '</div>'
    );
  }

  document.getElementById('toPickerBtn').addEventListener('click', function () {
    trip.budget = Math.max(20, Math.min(10000, parseInt(budgetInput.value, 10) || 20));
    if (trip.budget < 100) {
      document.getElementById('resultsBody').innerHTML = jokeCardHTML(trip.budget);
      showStep('results');
      return;
    }
    showStep('picker');
  });

  // gets a region "zone" (for a rough flight-distance estimate) and a cost
  // tier (1 = budget, 2 = mid, 3 = premium) that drives daily hotel/food/
  // activity/transport rates. numbers are estimates for a fun game, not
  // real fares -- but every one of the ~195 countries gets a real result
  // instead of a fixed shortlist.
  var ZONE_ORDER = { 1: 0, 2: 1, 3: 2, 4: 3, 5: 3.5, 6: 4.5, 7: 5.5, 8: 5, 9: 6, 10: 6.5, 11: 7.5 };
  var TIER_RATES = {
    1: { hotel: 35, food: 18, activities: 12, transport: 8 },
    2: { hotel: 85, food: 35, activities: 25, transport: 15 },
    3: { hotel: 170, food: 60, activities: 45, transport: 25 }
  };

  // most cities sit close to 1.0; pricier hubs run up to ~1.30, cheaper

  var domesticPool = flyableCountries.filter(function (c) { return c.cities.length >= 2; });

  function pickCity(country) { return pick(country.cities); }

  // picks two different cities within the same country -- never the same
  // city as both origin and destination
  function pickTwoCities(country) {
    var a = pick(country.cities);
    var b = a;
    while (b === a) { b = pick(country.cities); }
    return [a, b];
  }

  // ---------- free-text country inputs, backed by a datalist for
  // fast autocomplete instead of scrolling a giant dropdown ----------
  var departureInput = document.getElementById('departureInput');
  var destinationInput = document.getElementById('destinationInput');
  var departureOptions = document.getElementById('departureOptions');
  var destinationOptions = document.getElementById('destinationOptions');

  [departureOptions, destinationOptions].forEach(function (list) {
    var surpriseOpt = document.createElement('option');
    surpriseOpt.value = 'Surprise me';
    list.appendChild(surpriseOpt);
    countries.forEach(function (c) {
      var opt = document.createElement('option');
      opt.value = c.name + (c.noAirport ? ' (no international airport)' : '');
      list.appendChild(opt);
    });
  });

  function findCountry(name) {
    for (var i = 0; i < countries.length; i++) { if (countries[i].name === name) return countries[i]; }
    return null;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  var SURPRISE_WORDS = ['surprise', 'surprise me', 'random', 'anywhere', 'any', 'idk', 'you pick', 'you choose'];

  // reads whatever the user actually typed and resolves it to a country,
  // a "surprise me", or nothing at all -- matches by full country name or
  // by its ISO code, both case-insensitive, so "IN" and "india" both work.
  function resolveCountryInput(raw) {
    var trimmed = (raw || '').trim();
    if (!trimmed) return { type: 'empty' };
    var lower = trimmed.toLowerCase().replace(/\s*\(no international airport\)\s*$/, '');
    if (SURPRISE_WORDS.indexOf(lower) !== -1) return { type: 'surprise' };
    for (var i = 0; i < countries.length; i++) {
      var c = countries[i];
      if (c.name.toLowerCase() === lower) return { type: 'country', country: c };
      if (c.isoCode && c.isoCode.toLowerCase() === lower) return { type: 'country', country: c };
    }
    return { type: 'invalid', raw: trimmed };
  }

  var typoRoasts = [
    '"{input}" is not a country. Learn how to spell, or pick one from the list. Either works.',
    'The United Nations has never heard of "{input}". Neither has anyone else.',
    '"{input}" is not a real place. Not even a fake one we would accept.',
    'That is not a country, that is just violence against a keyboard.',
    'Bold of you to invent "{input}" and expect us to fly there.',
    '"{input}"? Try again, this time with a real country.'
  ];

  function invalidInputCardHTML(raw) {
    var line = pick(typoRoasts).replace('{input}', escapeHtml(raw));
    return (
      '<div class="card empty-card">' +
        '<h2>that is not a country.</h2>' +
        '<p>' + line + '</p>' +
      '</div>'
    );
  }

  function emptyInputCardHTML() {
    return (
      '<div class="card empty-card">' +
        '<h2>type something.</h2>' +
        '<p>Even "surprise me" would have worked. You typed nothing.</p>' +
      '</div>'
    );
  }

  // ---------- cost estimate ----------
  function flightCost(depZone, destZone) {
    var diff = Math.abs(ZONE_ORDER[depZone] - ZONE_ORDER[destZone]);
    return Math.round(180 + diff * 160);
  }
  // destCity's costMultiplier scales the destination-side costs (hotel,
  // food, activities, local transport) on top of the country tier -- the
  // flight itself is untouched, since that's a between-countries cost, not
  // a destination-city one. Every city has a multiplier; missing/undefined
  // safely falls back to 1.0 so this can never break a result.
  function estimateTrip(dep, dest, destCity) {
    var rates = TIER_RATES[dest.tier];
    var mult = (destCity && destCity.costMultiplier) || 1.0;
    var flight = dep.zone === dest.zone ? Math.round(flightCost(dep.zone, dest.zone) * 0.6) : flightCost(dep.zone, dest.zone);
    var hotel = Math.round(rates.hotel * NIGHTS * mult);
    var food = Math.round(rates.food * NIGHTS * mult);
    var activities = Math.round(rates.activities * NIGHTS * mult);
    var transport = Math.round(rates.transport * NIGHTS * mult);
    return {
      flight: flight, hotel: hotel, food: food, activities: activities, transport: transport,
      total: flight + hotel + food + activities + transport, nights: NIGHTS
    };
  }

  var destLines = [
    'A real place. A real estimate. Emotionally, still made up.',
    'This is what typical costs look like. Your actual mileage, and meltdowns, may vary.',
    'Somewhere on Earth, for a somewhat realistic price.',
    'This could genuinely be a trip. Wild.',
    'A destination with an actual airport. We checked. Mostly.'
  ];

  function noAirportCardHTML(country) {
    return (
      '<div class="card noairport-card">' +
        '<div class="big">' + country.name + '</div>' +
        '<p>' + country.line + '</p>' +
        '<p>Pick somewhere with a runway.</p>' +
      '</div>'
    );
  }

  function tripCardHTML(dep, dest, depCity, destCity) {
    depCity = depCity || pickCity(dep);
    destCity = destCity || pickCity(dest);
    var c = estimateTrip(dep, dest, destCity);
    var fits = c.total <= trip.budget;
    var left = trip.budget - c.total;
    return (
      '<div class="card dest-card">' +
        '<div class="dest-label">flying from ' + depCity.name + ', ' + dep.name + '</div>' +
        '<div class="dest-name">' + destCity.name + ', ' + dest.name + '</div>' +
        '<div class="dest-line">' + pick(destLines) + '</div>' +
        '<span class="fit-tag ' + (fits ? 'yes' : 'no') + '">' + (fits ? 'fits your budget' : 'does not fit your budget') + '</span>' +
        '<table class="breakdown">' +
          '<tr><td>Flight (estimate)</td><td>' + formatMoney(c.flight) + '</td></tr>' +
          '<tr><td>Hotel — ' + c.nights + ' nights</td><td>' + formatMoney(c.hotel) + '</td></tr>' +
          '<tr><td>Food</td><td>' + formatMoney(c.food) + '</td></tr>' +
          '<tr><td>Local transportation</td><td>' + formatMoney(c.transport) + '</td></tr>' +
          '<tr><td>Activities</td><td>' + formatMoney(c.activities) + '</td></tr>' +
          '<tr><td>Total estimate</td><td>' + formatMoney(c.total) + '</td></tr>' +
          '<tr><td>' + (fits ? 'Left over' : 'You are short') + '</td><td class="' + (fits ? 'fits' : 'short') + '">' + formatMoney(Math.abs(left)) + '</td></tr>' +
        '</table>' +
      '</div>'
    );
  }

  function pickRandomFlyable(exclude) {
    var pool = flyableCountries.filter(function (c) { return c.name !== exclude; });
    return pick(pool);
  }

  // the cheapest city in a country, for the honest-fallback search below --
  // deterministic on purpose, so the number it finds and the city it shows
  // are always the same one.
  function cheapestCity(country) {
    return country.cities.reduce(function (best, city) {
      return city.costMultiplier < best.costMultiplier ? city : best;
    });
  }

  // try a handful of random affordable pairs before giving up and just
  // showing the cheapest possible pairing, so "surprise me" still respects
  // the budget instead of being purely random. the destination city is
  // chosen as part of the search itself so the "fits budget" check always
  // matches the city-adjusted total that actually gets displayed.
  function findAffordablePair(depFixed, destFixed) {
    var attempts = 60;
    for (var i = 0; i < attempts; i++) {
      var dep = depFixed || pickRandomFlyable(destFixed ? destFixed.name : null);
      var dest = destFixed || pickRandomFlyable(dep.name);
      if (dep.name === dest.name) continue;
      var destCity = pickCity(dest);
      if (estimateTrip(dep, dest, destCity).total <= trip.budget) {
        return { dep: dep, dest: dest, depCity: pickCity(dep), destCity: destCity };
      }
    }
    // nothing affordable found -- fall back to the cheapest possible pair
    // so the game is still honest instead of silently failing
    var best = null, bestTotal = Infinity;
    var depsToTry = depFixed ? [depFixed] : flyableCountries;
    var destsToTry = destFixed ? [destFixed] : flyableCountries;
    depsToTry.forEach(function (d) {
      destsToTry.forEach(function (t) {
        if (d.name === t.name) return;
        var tCity = cheapestCity(t);
        var total = estimateTrip(d, t, tCity).total;
        if (total < bestTotal) { bestTotal = total; best = { dep: d, dest: t, depCity: pickCity(d), destCity: tCity }; }
      });
    });
    return best;
  }

  // ---------- domestic trips, for full Surprise Me in the $100-$400 range ----------
  // uses the same unified country/city database -- no separate list.
  function domesticFlightCost(tier) { return tier === 1 ? 25 : tier === 2 ? 70 : 110; }

  // toCity's costMultiplier scales the destination-side costs, same as the
  // international estimator -- the intra-country transportation leg stays
  // untouched, like the flight does internationally.
  function estimateDomesticTrip(country, nights, toCity) {
    var rates = TIER_RATES[country.tier];
    var mult = (toCity && toCity.costMultiplier) || 1.0;
    var flight = domesticFlightCost(country.tier);
    var hotel = Math.round(rates.hotel * nights * mult);
    var food = Math.round(rates.food * nights * mult);
    var activities = Math.round(rates.activities * nights * mult);
    var transport = Math.round(rates.transport * nights * mult);
    return {
      flight: flight, hotel: hotel, food: food, activities: activities, transport: transport,
      total: flight + hotel + food + activities + transport, nights: nights
    };
  }

  // domestic version of "surprise me still respects the budget": try random
  // country/city/night combos before falling back to the cheapest possible
  // one. cities are picked as part of the search so the "fits budget" check
  // always matches the city-adjusted total that gets displayed.
  function findAffordableDomesticTrip(budget) {
    var attempts = 60;
    for (var i = 0; i < attempts; i++) {
      var country = pick(domesticPool);
      var cities = pickTwoCities(country);
      for (var nights = 4; nights >= 1; nights--) {
        var est = estimateDomesticTrip(country, nights, cities[1]);
        if (est.total <= budget) {
          return { country: country, from: cities[0], to: cities[1], est: est };
        }
      }
    }
    var best = null, bestTotal = Infinity;
    domesticPool.forEach(function (country) {
      var toCity = cheapestCity(country);
      var est = estimateDomesticTrip(country, 1, toCity);
      if (est.total < bestTotal) { bestTotal = est.total; best = { country: country, toCity: toCity, est: est }; }
    });
    var fromCity = pick(best.country.cities.filter(function (c) { return c !== best.toCity; }));
    best.from = fromCity;
    best.to = best.toCity;
    return best;
  }

  function domesticTripCardHTML(trip_) {
    var est = trip_.est;
    var fits = est.total <= trip.budget;
    var left = trip.budget - est.total;
    return (
      '<div class="card dest-card">' +
        '<div class="dest-label">domestic trip within ' + trip_.country.name + '</div>' +
        '<div class="dest-name">' + trip_.from.name + ' &rarr; ' + trip_.to.name + '</div>' +
        '<div class="dest-line">Surprise Me kept this one inside the country, since that is what actually fit.</div>' +
        '<span class="fit-tag ' + (fits ? 'yes' : 'no') + '">' + (fits ? 'fits your budget' : 'does not fit your budget') + '</span>' +
        '<table class="breakdown">' +
          '<tr><td>Transportation (estimate)</td><td>' + formatMoney(est.flight) + '</td></tr>' +
          '<tr><td>Hotel — ' + est.nights + ' night' + (est.nights === 1 ? '' : 's') + '</td><td>' + formatMoney(est.hotel) + '</td></tr>' +
          '<tr><td>Food</td><td>' + formatMoney(est.food) + '</td></tr>' +
          '<tr><td>Local transportation</td><td>' + formatMoney(est.transport) + '</td></tr>' +
          '<tr><td>Activities</td><td>' + formatMoney(est.activities) + '</td></tr>' +
          '<tr><td>Total estimate</td><td>' + formatMoney(est.total) + '</td></tr>' +
          '<tr><td>' + (fits ? 'Left over' : 'You are short') + '</td><td class="' + (fits ? 'fits' : 'short') + '">' + formatMoney(Math.abs(left)) + '</td></tr>' +
        '</table>' +
      '</div>'
    );
  }

  document.getElementById('goBtn').addEventListener('click', function () {
    var body = document.getElementById('resultsBody');
    var depResolved = resolveCountryInput(departureInput.value);
    var destResolved = resolveCountryInput(destinationInput.value);

    if (depResolved.type === 'empty' || destResolved.type === 'empty') {
      body.innerHTML = emptyInputCardHTML();
      showStep('results');
      return;
    }
    if (depResolved.type === 'invalid') {
      body.innerHTML = invalidInputCardHTML(depResolved.raw);
      showStep('results');
      return;
    }
    if (destResolved.type === 'invalid') {
      body.innerHTML = invalidInputCardHTML(destResolved.raw);
      showStep('results');
      return;
    }

    var depSurprise = depResolved.type === 'surprise';
    var destSurprise = destResolved.type === 'surprise';

    // Surprise Me on EITHER side hands the whole trip to the game -- any
    // manually chosen country on the other side is not a constraint, it's
    // simply ignored. Only "manual -> manual" keeps the fixed-country flow.
    if (depSurprise || destSurprise) {
      if (trip.budget <= 400) {
        var domestic = findAffordableDomesticTrip(trip.budget);
        body.innerHTML = domesticTripCardHTML(domestic);
      } else {
        var surprisePair = findAffordablePair(null, null);
        body.innerHTML = tripCardHTML(surprisePair.dep, surprisePair.dest, surprisePair.depCity, surprisePair.destCity);
      }
      showStep('results');
      return;
    }

    var depCountry = depResolved.country;
    var destCountry = destResolved.country;

    if (depCountry.noAirport) { body.innerHTML = noAirportCardHTML(depCountry); showStep('results'); return; }
    if (destCountry.noAirport) { body.innerHTML = noAirportCardHTML(destCountry); showStep('results'); return; }

    if (depCountry.name === destCountry.name) {
      body.innerHTML = '<div class="card empty-card"><h2>that is not a trip.</h2><p>Leaving from ' + depCountry.name + ' to go to ' + destCountry.name + ' is just staying home with extra steps.</p></div>';
      showStep('results');
      return;
    }

    body.innerHTML = tripCardHTML(depCountry, destCountry);
    showStep('results');
  });

  document.getElementById('startOverBtn').addEventListener('click', function () {
    showStep('budget');
  });
</script>
</body>
</html>
