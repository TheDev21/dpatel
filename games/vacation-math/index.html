<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacation Math — Weird Little Games</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pacifico&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #fbeae4;
    --pink-deep: #f6dcd3;
    --ink: #23201d;
    --ink-dim: #56504a;
    --card-bg: #fffaf7;
    --orange: #ff5a1f;
    --red: #ff2d55;
    --teal: #1f8a70;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--pink);
    background-image: radial-gradient(circle, rgba(35,32,29,0.06) 1px, transparent 1px);
    background-size: 26px 26px;
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    padding: 32px 18px 80px;
  }
  h1, .display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; font-weight: 400; }
  a { color: inherit; text-decoration: none; }

  .corner-badge {
    position: fixed;
    top: 55px;
    left: 26px;
    z-index: 50;
    transform: rotate(-25deg);
    transform-origin: top left;
    text-align: center;
    color: var(--ink);
    text-decoration: underline;
    font-family: 'Pacifico', cursive;
    font-weight: 400;
    font-size: 40px;
    line-height: 1.05;
    transition: color 0.15s ease;
  }
  .corner-badge:hover { animation: badgeWobble 1.6s ease; color: var(--orange); }
  @keyframes badgeWobble {
    0%, 100% { transform: rotate(-25deg); }
    15% { transform: rotate(-12deg); }
    30% { transform: rotate(-36deg); }
    45% { transform: rotate(-16deg); }
    60% { transform: rotate(-32deg); }
    75% { transform: rotate(-21deg); }
    90% { transform: rotate(-27deg); }
  }

  .wrap { max-width: 480px; margin: 0 auto; text-align: center; }

  h1 { font-size: clamp(2.2rem, 7vw, 3rem); margin: 10px 0 2px; }
  h1 span { color: var(--orange); }
  .tagline { font-size: 0.85rem; color: var(--ink-dim); margin: 0 0 26px; }

  .budget-card {
    background: var(--card-bg);
    border: 3px solid var(--ink);
    border-radius: 20px;
    padding: 22px 24px;
    box-shadow: 5px 6px 0 rgba(35,32,29,0.14);
    margin-bottom: 20px;
  }
  .budget-amount {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3rem;
    color: var(--orange);
    margin-bottom: 4px;
  }
  .budget-input-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .budget-input-row input[type="number"] {
    width: 110px;
    font-family: 'DM Mono', monospace;
    font-size: 0.95rem;
    padding: 8px 10px;
    border: 2px solid var(--ink);
    border-radius: 10px;
    text-align: center;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--orange);
    margin-bottom: 6px;
  }
  .slider-labels {
    display: flex;
    justify-content: space-between;
    font-size: 0.68rem;
    color: var(--ink-dim);
    margin-bottom: 16px;
  }
  .plan-btn {
    display: block;
    width: 100%;
    background: var(--orange);
    color: #fff;
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 12px;
    font-size: 0.95rem;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .plan-btn:hover { background: var(--red); transform: translateY(-2px); }

  #result { display: none; }
  #result.show { display: block; }

  .dest-card {
    background: var(--card-bg);
    border: 3px solid var(--ink);
    border-radius: 20px;
    padding: 22px 24px;
    box-shadow: 5px 6px 0 rgba(35,32,29,0.14);
    margin-bottom: 16px;
    text-align: left;
  }
  .dest-label { font-size: 0.75rem; color: var(--ink-dim); margin-bottom: 2px; }
  .dest-name { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; margin-bottom: 14px; }

  table.breakdown { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.breakdown td { padding: 7px 0; border-bottom: 1.5px dashed var(--pink-deep); }
  table.breakdown td:last-child { text-align: right; font-weight: 500; }
  table.breakdown tr:last-child td { border-bottom: none; color: var(--teal); font-weight: 600; }

  .afford-card {
    background: var(--card-bg);
    border: 3px solid var(--ink);
    border-radius: 20px;
    padding: 22px 24px;
    box-shadow: 5px 6px 0 rgba(35,32,29,0.14);
    text-align: left;
  }
  .afford-card h2 { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; margin: 0 0 10px; }
  .afford-card ul { margin: 0; padding-left: 20px; font-size: 0.85rem; line-height: 1.9; }

  .joke-card {
    background: var(--card-bg);
    border: 3px solid var(--ink);
    border-radius: 20px;
    padding: 28px 24px;
    box-shadow: 5px 6px 0 rgba(35,32,29,0.14);
  }
  .joke-card .big { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; margin-bottom: 8px; }
  .joke-card p { margin: 0 0 4px; font-size: 0.9rem; color: var(--ink-dim); }
</style>
</head>
<body>
<div class="wrap">

  <a class="corner-badge" href="../../index.html">Weird<br>Little<br>Games.</a>
  <h1>Vacation <span>Math</span></h1>
  <p class="tagline">not a real booking tool. just typical-cost guesswork with attitude.</p>

  <div class="budget-card">
    <div class="budget-amount" id="budgetAmount">$1,000</div>
    <div class="budget-input-row">
      <span>$</span>
      <input type="number" id="budgetInput" min="20" max="10000" step="10" value="1000">
    </div>
    <input type="range" id="budgetSlider" min="20" max="10000" step="10" value="1000">
    <div class="slider-labels">
      <span>$20</span>
      <span>$5000</span>
      <span>$10000</span>
    </div>
    <button class="plan-btn" id="planBtn">plan my trip</button>
  </div>

  <div id="result"></div>

</div>

<script>
  var budgetInput = document.getElementById('budgetInput');
  var budgetSlider = document.getElementById('budgetSlider');
  var budgetAmount = document.getElementById('budgetAmount');
  var resultEl = document.getElementById('result');

  function formatMoney(n) {
    return '$' + Math.round(n).toLocaleString('en-US');
  }

  function syncFromSlider() {
    budgetInput.value = budgetSlider.value;
    budgetAmount.textContent = formatMoney(budgetSlider.value);
  }
  function syncFromInput() {
    var v = Math.max(20, Math.min(10000, parseInt(budgetInput.value, 10) || 20));
    budgetSlider.value = v;
    budgetAmount.textContent = formatMoney(v);
  }
  budgetSlider.addEventListener('input', syncFromSlider);
  budgetInput.addEventListener('input', syncFromInput);

  var tiers = [
    {
      max: 99,
      joke: true
    },
    {
      max: 499,
      nights: 1,
      destinations: ['a nearby beach town', 'the next state over', 'a random city three hours away', 'a shared lake house', 'your cousin\'s hometown']
    },
    {
      max: 1499,
      nights: 2,
      destinations: ['Chicago', 'New Orleans', 'Nashville', 'Austin', 'Denver', 'Portland', 'Savannah']
    },
    {
      max: 2999,
      nights: 4,
      destinations: ['Mexico City', 'Toronto', 'Vancouver', 'San Juan', 'the Bahamas (budget resort)', 'Lima']
    },
    {
      max: 4999,
      nights: 6,
      destinations: ['Tokyo (budget route)', 'Lisbon', 'Bangkok', 'Prague', 'Iceland (off-season)', 'Seoul']
    },
    {
      max: Infinity,
      nights: 9,
      destinations: ['Tokyo (comfortably)', 'Bali', 'Paris', 'New Zealand', 'the Amalfi Coast', 'wherever you actually want, bro']
    }
  ];

  var transportModes = ['a round-trip flight', 'a very committed road trip', 'a train ticket and a dream', 'a rideshare that added up fast'];
  var foodLines = ['food that is not quite fine dining', 'more convenience-store meals than planned', 'one nice dinner and a lot of regret snacks', 'street food, mostly'];
  var activityLines = ['two or three actual attractions', 'one paid activity and a lot of walking around', 'a museum and a long nap', 'whatever\'s free plus one splurge'];
  var drinkLines = ['enough questionable decisions to make it memorable', 'at least one drink you will not remember ordering', 'a bar tab that outlived the trip', 'a gift shop impulse buy you will not use again'];

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function tierFor(budget) {
    for (var i = 0; i < tiers.length; i++) {
      if (budget <= tiers[i].max) return tiers[i];
    }
    return tiers[tiers.length - 1];
  }

  function renderJoke(budget) {
    var hours = Math.max(1, Math.round(budget / 8));
    resultEl.innerHTML =
      '<div class="joke-card">' +
      '<div class="big">' + formatMoney(budget) + '</div>' +
      '<p>Congratulations.</p>' +
      '<p>You can visit the nearest city and buy lunch.</p>' +
      '<p>Trip duration: ' + hours + ' hour' + (hours === 1 ? '' : 's') + '.</p>' +
      '</div>';
  }

  function renderTrip(budget, tier) {
    var destination = pick(tier.destinations);
    var transportation = budget * 0.28;
    var hotel = budget * 0.26;
    var food = budget * 0.15;
    var activities = budget * 0.12;
    var randomBs = budget * 0.04;
    var remaining = budget - (transportation + hotel + food + activities + randomBs);

    resultEl.innerHTML =
      '<div class="dest-card">' +
        '<div class="dest-label">your destination:</div>' +
        '<div class="dest-name">' + destination + '</div>' +
        '<table class="breakdown">' +
          '<tr><td>Transportation</td><td>' + formatMoney(transportation) + '</td></tr>' +
          '<tr><td>Hotel — ' + tier.nights + ' night' + (tier.nights === 1 ? '' : 's') + '</td><td>' + formatMoney(hotel) + '</td></tr>' +
          '<tr><td>Food</td><td>' + formatMoney(food) + '</td></tr>' +
          '<tr><td>Activities</td><td>' + formatMoney(activities) + '</td></tr>' +
          '<tr><td>Random bullshit</td><td>' + formatMoney(randomBs) + '</td></tr>' +
          '<tr><td>Remaining</td><td>' + formatMoney(remaining) + '</td></tr>' +
        '</table>' +
      '</div>' +
      '<div class="afford-card">' +
        '<h2>you can afford:</h2>' +
        '<ul>' +
          '<li>' + pick(transportModes) + '</li>' +
          '<li>' + tier.nights + ' night' + (tier.nights === 1 ? '' : 's') + ' in ' + destination + '</li>' +
          '<li>' + pick(activityLines) + '</li>' +
          '<li>' + pick(foodLines) + '</li>' +
          '<li>' + pick(drinkLines) + '</li>' +
        '</ul>' +
      '</div>';
  }

  function planTrip() {
    var budget = Math.max(20, Math.min(10000, parseInt(budgetInput.value, 10) || 20));
    var tier = tierFor(budget);
    if (tier.joke) {
      renderJoke(budget);
    } else {
      renderTrip(budget, tier);
    }
    resultEl.classList.add('show');
  }

  document.getElementById('planBtn').addEventListener('click', planTrip);
</script>
</body>
</html>
