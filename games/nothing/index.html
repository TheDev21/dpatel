<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nothing. — Weird Little Games</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ffffff' stroke='%2323201d' stroke-width='4'/%3E%3Ctext x='50' y='66' text-anchor='middle' font-family='Courier New, monospace' font-size='46' fill='%2323201d'%3En.%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Pacifico&display=swap" rel="stylesheet">
<style>
  :root { --ink: #23201d; --orange: #ff5a1f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: #ffffff;
    color: var(--ink);
    overflow: hidden;
  }
  a { color: inherit; text-decoration: none; }

  .corner-badge {
    position: fixed;
    top: 55px;
    left: 26px;
    z-index: 50;
    transform: rotate(-25deg);
    transform-origin: top left;
    text-align: center;
    color: var(--ink);
    text-decoration: underline;
    font-family: 'Pacifico', cursive;
    font-weight: 400;
    font-size: 40px;
    line-height: 1.05;
    opacity: 0.06;
    transition: opacity 0.4s ease, color 0.15s ease;
  }
  .corner-badge:hover { opacity: 1; animation: badgeWobble 1.6s ease; color: var(--orange); }
  @media (max-width: 960px) {
    .corner-badge { top: 30px; left: 14px; font-size: 22px; }
  }
  @keyframes badgeWobble {
    0%, 100% { transform: rotate(-25deg); }
    15% { transform: rotate(-12deg); }
    30% { transform: rotate(-36deg); }
    45% { transform: rotate(-16deg); }
    60% { transform: rotate(-32deg); }
    75% { transform: rotate(-21deg); }
    90% { transform: rotate(-27deg); }
  }

  .lines {
    position: absolute;
    top: 14%;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 720px;
    text-align: center;
  }
  .line {
    font-family: 'Special Elite', 'DM Mono', monospace;
    font-size: clamp(1.7rem, 8vw, 2.6rem);
    line-height: 1.4;
    color: var(--ink);
    margin: 0 0 10px;
    opacity: 1;
    transition: opacity 3s ease;
  }
  .line.faded { opacity: 0; }
  .line.typing::after {
    content: '';
    display: inline-block;
    width: 0.5ch;
    height: 1em;
    background: var(--ink);
    margin-left: 2px;
    vertical-align: -0.15em;
    animation: blink 0.9s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .countdown {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Special Elite', 'DM Mono', monospace;
    font-size: clamp(6rem, 30vw, 14rem);
    color: var(--ink);
    opacity: 0;
    transition: opacity 0.6s ease;
  }
  .countdown.show { opacity: 1; }
</style>
</head>
<body>
<a class="corner-badge" href="https://weirdlittlegames.lol">Weird<br>Little<br>Games.</a>

<div class="lines" id="lines"></div>
<div class="countdown" id="countdown"></div>

<script>
  var linesEl = document.getElementById('lines');
  var FADE_DELAY = 4000;
  var FADE_DURATION = 3000;

  function typeLine(text, speed, cb) {
    setTimeout(function () {
      var line = document.createElement('div');
      line.className = 'line typing';
      linesEl.appendChild(line);
      var i = 0;
      var iv = setInterval(function () {
        line.textContent = text.slice(0, i + 1);
        i++;
        if (i >= text.length) {
          clearInterval(iv);
          line.classList.remove('typing');
          setTimeout(function () {
            line.classList.add('faded');
            if (cb) setTimeout(cb, FADE_DURATION);
          }, FADE_DELAY);
        }
      }, speed);
    }, 1000);
  }

  setTimeout(function () {
    typeLine('why you still here?', 500);
  }, 30000);

  setTimeout(function () {
    typeLine("seriously, there's nothing here. go do something.", 500);
  }, 120000);

  setTimeout(function () {
    typeLine('okay, you win. you can close this game now.', 500, startCountdown);
  }, 300000);

  function startCountdown() {
    var countEl = document.getElementById('countdown');
    var n = 5;
    countEl.textContent = n + '.';
    countEl.classList.add('show');
    var iv = setInterval(function () {
      n--;
      if (n <= 0) {
        clearInterval(iv);
        window.location.href = 'https://weirdlittlegames.lol';
        return;
      }
      countEl.textContent = n + '.';
    }, 1500);
  }
</script>
</body>
</html>
