<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Startup Slot Machine</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #fbeae4;
    --pink-deep: #f6dcd3;
    --ink: #23201d;
    --ink-dim: #56504a;
    --card-bg: #fffaf7;
    --orange: #ff5a1f;
    --red: #ff2d55;
    --gold: #c98f00;
    --gold-bright: #ffd15c;
    --common: #9a9a9a;
    --rare: #3d95ce;
    --legendary: var(--orange);
    --mythic: var(--red);
    --neon-pink: #ff2ea0;
    --neon-cyan: #35e6ff;
    --cabinet-dark: #1a1030;
    --cabinet-darker: #100a1f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--pink);
    background-image: radial-gradient(circle, rgba(35,32,29,0.06) 1px, transparent 1px);
    background-size: 26px 26px;
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }
  h1, .display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; font-weight: 400; }
  a { color: inherit; text-decoration: none; }

  .corner-badge {
    position: fixed;
    top: 55px;
    left: 26px;
    z-index: 50;
    transform: rotate(-25deg);
    transform-origin: top left;
    text-align: center;
    color: var(--ink);
    text-decoration: underline;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 40px;
    line-height: 1.05;
    transition: color 0.15s ease;
  }
  .corner-badge:hover { animation: badgeWobble 1.6s ease; color: var(--orange); }
  @keyframes badgeWobble {
    0%, 100% { transform: rotate(-25deg); }
    15% { transform: rotate(-12deg); }
    30% { transform: rotate(-36deg); }
    45% { transform: rotate(-16deg); }
    60% { transform: rotate(-32deg); }
    75% { transform: rotate(-21deg); }
    90% { transform: rotate(-27deg); }
  }

  .wrap { width: 100%; max-width: 480px; text-align: center; }

  h1 { font-size: clamp(2.4rem, 7vw, 3.2rem); margin: 0 0 4px; }
  h1 span { color: var(--orange); }
  .tagline { font-size: 0.85rem; color: var(--ink-dim); margin: 0 0 22px; }

  .stats-row {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-bottom: 22px;
    font-size: 0.72rem;
    color: var(--ink-dim);
  }
  .stats-row b { color: var(--ink); }

  /* ---------- the cabinet (deliberately breaks from the site's pastel
     system -- a slot machine needs to actually look like a casino
     machine: chrome, neon, dark glass, not soft pink) ---------- */
  .cabinet-wrap {
    position: relative;
    margin-bottom: 20px;
    user-select: none;
  }

  .cabinet {
    position: relative;
    background:
      radial-gradient(circle at 50% 30%, #3d2560, transparent 60%),
      linear-gradient(160deg, #2a1a4a, var(--cabinet-dark) 60%, var(--cabinet-darker));
    border: 5px solid #ddb84a;
    border-radius: 26px;
    box-shadow:
      0 0 0 3px #1a1030,
      0 0 22px 3px rgba(255,46,160,0.35),
      7px 9px 0 rgba(35,32,29,0.3),
      inset 0 0 30px rgba(255,46,160,0.12);
    padding: 18px 16px 22px;
  }
  .cabinet::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1.5px solid rgba(255,209,92,0.4);
    border-radius: 20px;
    pointer-events: none;
  }

  .marquee { display: flex; justify-content: center; gap: 7px; margin-bottom: 12px; position: relative; z-index: 1; }
  .bulb {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #6b4a1a;
    border: 1px solid #16102a;
    box-shadow: 0 0 4px 1px rgba(255,179,71,0.4);
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  .bulb.lit { background: var(--gold-bright); box-shadow: 0 0 10px 4px rgba(255,209,92,0.95); }

  .cabinet-title {
    position: relative; z-index: 1;
    font-family: 'Bebas Neue', sans-serif;
    color: var(--neon-cyan);
    font-size: 1.05rem;
    letter-spacing: 0.18em;
    text-align: center;
    margin-bottom: 10px;
    text-shadow: 0 0 8px rgba(53,230,255,0.8), 0 0 2px #fff;
  }

  .reel-window {
    position: relative; z-index: 1;
    background: var(--cabinet-darker);
    border: 3px solid #4a3d6b;
    border-radius: 16px;
    padding: 14px;
    box-shadow: inset 0 4px 14px rgba(0,0,0,0.6);
  }
  .reels { display: flex; gap: 10px; justify-content: center; }
  .reel {
    width: 76px; height: 76px;
    border-radius: 14px;
    background: linear-gradient(160deg, #fff, #e9e4f2 60%, #d6cee6);
    border: 2.5px solid #8b82a0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
    overflow: hidden;
    box-shadow: inset 0 2px 3px rgba(255,255,255,0.9), inset 0 -3px 6px rgba(0,0,0,0.15);
  }
  .reel.stopped { box-shadow: inset 0 2px 3px rgba(255,255,255,0.9), inset 0 -3px 6px rgba(0,0,0,0.15), 0 0 10px 1px rgba(255,209,92,0.5); }
  .reel-symbol { animation: spinPop 0.08s ease-out; }
  @keyframes spinPop {
    0% { transform: scale(0.7) rotate(-8deg); opacity: 0.4; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  /* ---------- lever (drag it down to spin) ---------- */
  .lever-wrap {
    position: absolute;
    top: 0; left: 100%; bottom: 0;
    width: 58px;
  }
  .lever-base {
    position: absolute;
    left: 10px; top: 14%; bottom: 14%;
    width: 10px;
    background: linear-gradient(90deg, #6b6178, #d8d3ce, #6b6178);
    border: 1.5px solid var(--ink);
    border-radius: 6px;
  }
  .lever-track {
    position: absolute;
    right: 2px; top: 14%;
    width: 26px; height: 72%;
    touch-action: none;
    cursor: grab;
  }
  .lever-track.dragging { cursor: grabbing; }
  .lever-rod {
    position: absolute;
    left: 50%; top: 0; bottom: 30px;
    width: 6px;
    background: linear-gradient(90deg, #6b6178, #f4f1fa, #6b6178);
    border: 1.5px solid var(--ink);
    border-radius: 3px;
    transform: translateX(-50%);
    transform-origin: bottom center;
  }
  .lever-track:not(.dragging) .lever-rod,
  .lever-track:not(.dragging) .lever-knob {
    transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .lever-knob {
    position: absolute;
    left: 50%; top: -6px;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 28%, #ff8f6b, var(--red) 65%, #b3123a);
    border: 2.5px solid var(--ink);
    transform: translateX(-50%);
    box-shadow: 0 2px 3px rgba(0,0,0,0.3);
  }

  .card {
    background: var(--card-bg);
    border: 3px solid var(--ink);
    border-radius: 22px;
    box-shadow: 6px 7px 0 rgba(35,32,29,0.12);
    padding: 24px 26px;
    margin-bottom: 20px;
    min-height: 130px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: box-shadow 0.2s ease;
  }
  .card.rarity-rare { box-shadow: 6px 7px 0 rgba(61,149,206,0.35); }
  .card.rarity-legendary { box-shadow: 6px 7px 0 rgba(255,90,31,0.4); }
  .card.rarity-mythic {
    box-shadow: 6px 7px 0 rgba(255,45,85,0.5);
    animation: mythicPulse 1.6s ease-in-out infinite;
  }
  @keyframes mythicPulse {
    0%, 100% { box-shadow: 6px 7px 0 rgba(255,45,85,0.5), 0 0 0 0 rgba(255,45,85,0.4); }
    50% { box-shadow: 6px 7px 0 rgba(255,45,85,0.5), 0 0 0 10px rgba(255,45,85,0); }
  }
  .card.landed { animation: landPop 0.3s ease-out; }
  @keyframes landPop {
    0% { transform: scale(0.92); }
    60% { transform: scale(1.03); }
    100% { transform: scale(1); }
  }

  .rarity-badge {
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 14px;
    border-radius: 999px;
    border: 2px solid var(--ink);
    color: #fff;
  }
  .rarity-badge.common { background: var(--common); }
  .rarity-badge.rare { background: var(--rare); }
  .rarity-badge.legendary { background: var(--legendary); }
  .rarity-badge.mythic { background: var(--mythic); }

  .empty-state { color: var(--ink-dim); font-size: 0.85rem; }

  .company-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem;
    line-height: 1;
    margin-bottom: 8px;
    word-break: break-word;
  }
  .pitch-line { font-size: 0.9rem; line-height: 1.5; margin-bottom: 12px; }
  .valuation { font-size: 0.76rem; color: var(--gold); font-weight: 500; }

  .hint { font-size: 0.78rem; color: var(--ink-dim); margin-bottom: 16px; }
  .hint b { color: var(--ink); }

  .log-toggle {
    display: inline-block;
    margin: 0 6px;
    font-size: 0.78rem;
    color: var(--ink-dim);
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
    font-family: 'DM Mono', monospace;
  }
  .log-toggle:hover { color: var(--orange); }

  .log-panel {
    margin-top: 14px;
    text-align: left;
    max-height: 220px;
    overflow-y: auto;
    border: 2px solid var(--ink);
    border-radius: 16px;
    background: var(--card-bg);
    padding: 12px 16px;
  }
  .log-panel[hidden] { display: none; }
  .log-item { padding: 8px 0; border-bottom: 1px dashed var(--pink-deep); font-size: 0.78rem; }
  .log-item:last-child { border-bottom: none; }
  .log-item .log-name { font-weight: 600; }
  .log-item .log-tag {
    display: inline-block;
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 1px 7px;
    border-radius: 999px;
    color: #fff;
    margin-left: 6px;
  }
  .log-tag.common { background: var(--common); }
  .log-tag.rare { background: var(--rare); }
  .log-tag.legendary { background: var(--legendary); }
  .log-tag.mythic { background: var(--mythic); }
</style>
</head>
<body>

<a class="corner-badge" href="../../index.html">Weird<br>Little<br>Games.</a>

<div class="wrap">
  <h1>Startup Slot <span>Machine</span></h1>
  <p class="tagline">drag the lever down. birth a startup. no investors were harmed.</p>

  <div class="stats-row">
    <span><b id="statTotal">0</b> pitches</span>
    <span><b id="statLegendary">0</b> legendary</span>
    <span><b id="statMythic">0</b> mythic</span>
  </div>

  <div class="cabinet-wrap">
    <div class="cabinet">
      <div class="marquee" id="marquee">
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        <span class="bulb"></span>
      </div>
      <div class="cabinet-title">SERIES SEED</div>
      <div class="reel-window">
        <div class="reels">
          <div class="reel" id="reel1">🍒</div>
          <div class="reel" id="reel2">🍒</div>
          <div class="reel" id="reel3">🍒</div>
        </div>
      </div>
    </div>

    <div class="lever-wrap">
      <div class="lever-base"></div>
      <div class="lever-track" id="leverTrack" aria-label="drag down to pull the lever">
        <div class="lever-rod" id="leverRod"></div>
        <div class="lever-knob" id="leverKnob"></div>
      </div>
    </div>
  </div>

  <p class="hint" id="hint">grab the <b>lever</b> and drag it down to spin</p>

  <div class="card" id="card">
    <div class="empty-state" id="emptyState">no pitch yet. give it a pull.</div>
  </div>

  <button class="log-toggle" id="logToggle">show pitch history</button>

  <div class="log-panel" id="logPanel" hidden></div>
</div>

<script>
  // ---------- word banks ----------
  const prefixes = ['Byte', 'Vibe', 'Nomad', 'Kelp', 'Fluffle', 'Grindr', 'Zynq', 'Loop', 'Hush', 'Glow', 'Drift', 'Moss', 'Quill', 'Snap', 'Pulse', 'Yolk', 'Fern', 'Crumb', 'Static', 'Honk'];
  const suffixes = ['ly', 'ify', 'io', 'ai', 'hub', 'base', 'loop', 'lab', '.co', 'ster', 'ory', 'wise'];

  const brands = ['Uber', 'Airbnb', 'Tinder', 'Duolingo', 'Wikipedia', 'Costco', 'Yelp', 'Venmo', 'DoorDash', 'LinkedIn'];
  const nouns = ['dog walking', 'houseplants', 'parking spots', 'leftover food', 'awkward silences', 'group chats', 'parallel parking', 'lost socks', 'unread emails', 'office small talk', 'grandmas', 'traffic cones', 'expired coupons', 'gym anxiety', 'roommates'];
  const verbs = ['judges your life choices', 'guilt-trips you into productivity', 'roasts your typos', 'unionizes with other appliances', 'files your taxes badly', 'ghosts you on purpose', 'negotiates your rent', 'narrates your breakfast'];
  const adjectives = ['Gig', 'Passive-Aggressive', 'Artisanal', 'Blockchain-Powered', 'Hyperlocal', 'Subscription-Based', 'Crowdsourced', 'AI-Native'];
  const nouns2 = ['Houseplant', 'Nap', 'Apology', 'Parking Ticket', 'Group Project', 'Group Chat', 'Office Chair', 'Wifi Password'];

  const mythicPitches = [
    "A subscription box that mails you back your own trash, but curated.",
    "An app that lets you rate your neighbors' recycling technique.",
    "We deliver silence. Literally. A drone shows up and just... stands there.",
    "A social network exclusively for people who haven't logged in since 2019.",
    "Venture-backed jury duty. You bid on which case you get.",
    "An AI therapist that only responds in Wingdings.",
    "A dating app that matches you based on shared group chat trauma.",
    "We NFT your excuses. Mint your 'sorry I'm late' as a collectible.",
    "A gym membership you can never cancel, by design, as a feature.",
    "An app that live-tweets your job interview on your behalf.",
    "Uber, but for guilt. We deliver it directly to your family.",
    "A smart fridge that unionizes and demands better snacks.",
    "We turn your browser history into a bedtime story, read aloud.",
    "A startup that only pivots. It has never shipped a product.",
    "An app that sends your ex a weather update every morning, unprompted."
  ];

  // ---------- rarity ----------
  function rollRarity() {
    const r = Math.random() * 100;
    if (r < 3) return 'mythic';
    if (r < 15) return 'legendary';
    if (r < 40) return 'rare';
    return 'common';
  }

  function randomOf(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function generateCompanyName() {
    return randomOf(prefixes) + randomOf(suffixes);
  }

  function generatePitch(rarity) {
    if (rarity === 'mythic') return randomOf(mythicPitches);
    if (rarity === 'legendary') return `The ${randomOf(adjectives)} Economy for ${randomOf(nouns2)}s.`;
    if (rarity === 'rare') return `An AI-powered ${randomOf(nouns2).toLowerCase()} that ${randomOf(verbs)}.`;
    return `${randomOf(brands)}, but for ${randomOf(nouns)}.`;
  }

  function generateValuation(rarity) {
    const scale = { common: 1e6, rare: 5e7, legendary: 8e8, mythic: 1e10 };
    const base = scale[rarity];
    const amount = Math.round((base + Math.random() * base * 3) / 1e6) * 1e6;
    const units = ['', 'K', 'M', 'B', 'T'];
    let u = 0, n = amount;
    while (n >= 1000 && u < units.length - 1) { n /= 1000; u++; }
    return '$' + n.toFixed(n < 10 ? 1 : 0) + units[u] + ' pre-revenue';
  }

  // ---------- state ----------
  let state = { total: 0, legendary: 0, mythic: 0, log: [] };

  function loadState() {
    try {
      const saved = JSON.parse(localStorage.getItem('startup-slot-machine-save'));
      if (saved) state = Object.assign(state, saved);
    } catch (e) {}
  }

  function saveState() {
    localStorage.setItem('startup-slot-machine-save', JSON.stringify(state));
  }

  loadState();

  // ---------- render ----------
  const card = document.getElementById('card');
  const statTotal = document.getElementById('statTotal');
  const statLegendary = document.getElementById('statLegendary');
  const statMythic = document.getElementById('statMythic');
  const logPanel = document.getElementById('logPanel');
  const logToggle = document.getElementById('logToggle');
  const marquee = document.getElementById('marquee');
  const hint = document.getElementById('hint');

  function renderStats() {
    statTotal.textContent = state.total;
    statLegendary.textContent = state.legendary;
    statMythic.textContent = state.mythic;
  }

  function renderLog() {
    if (state.log.length === 0) {
      logPanel.innerHTML = '<div class="empty-state">no pitches yet</div>';
      return;
    }
    logPanel.innerHTML = state.log.slice(0, 30).map(item => `
      <div class="log-item">
        <span class="log-name">${item.name}</span>
        <span class="log-tag ${item.rarity}">${item.rarity}</span><br>
        <span>${item.pitch}</span>
      </div>
    `).join('');
  }

  function setBulbs(litCount) {
    marquee.querySelectorAll('.bulb').forEach((b, i) => b.classList.toggle('lit', i < litCount));
  }
  let marqueeTimer = null;
  function chaseBulbs() {
    const bulbs = marquee.querySelectorAll('.bulb');
    let i = 0;
    marqueeTimer = setInterval(() => {
      bulbs.forEach((b, j) => b.classList.toggle('lit', j === i % bulbs.length));
      i++;
    }, 90);
  }
  function stopBulbChase(allLit) {
    if (marqueeTimer) clearInterval(marqueeTimer);
    marqueeTimer = null;
    marquee.querySelectorAll('.bulb').forEach(b => b.classList.toggle('lit', allLit));
  }

  // ---------- sound (WebAudio, no files) ----------
  let audioCtx = null;
  let soundOn = true;
  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playTick(landed) {
    if (!soundOn) return;
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = landed ? 520 : 220 + Math.random() * 90;
    gain.gain.value = 0.05;
    osc.connect(gain).connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    osc.start(t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
    osc.stop(t + 0.09);
  }
  function playWinChime(rarity) {
    if (!soundOn) return;
    ensureAudio();
    const chords = { mythic: [523, 659, 784, 1046], legendary: [523, 659, 784], rare: [440, 554], common: [392] };
    const freqs = chords[rarity] || chords.common;
    freqs.forEach((f, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      osc.connect(gain).connect(audioCtx.destination);
      const t = audioCtx.currentTime + i * 0.09;
      osc.start(t);
      gain.gain.setValueAtTime(0.09, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      osc.stop(t + 0.31);
    });
  }
  function playNearMiss() {
    if (!soundOn) return;
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(500, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.25);
    gain.gain.value = 0.05;
    osc.connect(gain).connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    osc.start(t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
    osc.stop(t + 0.27);
  }
  function playLeverClunk() {
    if (!soundOn) return;
    ensureAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(160, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.12);
    gain.gain.value = 0.08;
    osc.connect(gain).connect(audioCtx.destination);
    const t = audioCtx.currentTime;
    osc.start(t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
    osc.stop(t + 0.14);
  }

  // ---------- reel spin ----------
  const tierOrder = ['common', 'rare', 'legendary', 'mythic'];
  const tierSymbols = { common: '🍒', rare: '💎', legendary: '👑', mythic: '🦄' };

  function spinReel(el, ticks, finalSymbol, nearMissIdx, onDone) {
    let tick = 0;
    el.classList.remove('stopped');
    function step() {
      if (tick >= ticks) {
        el.innerHTML = `<span class="reel-symbol">${finalSymbol}</span>`;
        el.classList.add('stopped');
        playTick(true);
        onDone();
        return;
      }
      let sym;
      if (nearMissIdx !== undefined && tick === ticks - 2 && nearMissIdx < 3 && Math.random() < 0.45) {
        sym = tierSymbols[tierOrder[nearMissIdx + 1]];
        playNearMiss();
      } else {
        sym = tierSymbols[tierOrder[Math.floor(Math.random() * tierOrder.length)]];
        playTick(false);
      }
      el.innerHTML = `<span class="reel-symbol">${sym}</span>`;
      tick++;
      const delay = 55 + tick * tick * 1.6;
      setTimeout(step, delay);
    }
    step();
  }

  let spinning = false;

  function pull() {
    if (spinning) return;
    spinning = true;
    playLeverClunk();
    hint.textContent = 'spinning...';
    chaseBulbs();

    const rarity = rollRarity();
    const targetSymbol = tierSymbols[rarity];
    const targetIdx = tierOrder.indexOf(rarity);

    card.className = 'card';
    card.innerHTML = '<div class="empty-state">...</div>';

    const reel1 = document.getElementById('reel1');
    const reel2 = document.getElementById('reel2');
    const reel3 = document.getElementById('reel3');

    spinReel(reel1, 11, targetSymbol, undefined, () => {
      spinReel(reel2, 15, targetSymbol, undefined, () => {
        spinReel(reel3, 20, targetSymbol, targetIdx, () => {
          reveal(rarity);
        });
      });
    });
  }

  function reveal(rarity) {
    const name = generateCompanyName();
    const pitch = generatePitch(rarity);
    const valuation = generateValuation(rarity);

    state.total++;
    if (rarity === 'legendary') state.legendary++;
    if (rarity === 'mythic') state.mythic++;
    state.log.unshift({ name, pitch, rarity });
    if (state.log.length > 50) state.log.pop();
    saveState();
    renderStats();
    renderLog();

    playWinChime(rarity);
    stopBulbChase(rarity === 'legendary' || rarity === 'mythic');
    if (rarity === 'common' || rarity === 'rare') {
      setTimeout(() => setBulbs(0), 900);
    }

    card.className = 'card landed' + (rarity !== 'common' ? ' rarity-' + rarity : '');
    card.innerHTML = `
      <div class="rarity-badge ${rarity}">${rarity}</div>
      <div class="company-name">${name}</div>
      <div class="pitch-line">${pitch}</div>
      <div class="valuation">valued at ${valuation}</div>
    `;

    spinning = false;
    hint.innerHTML = 'grab the <b>lever</b> and drag it down to spin';
  }

  // ---------- lever drag ----------
  const leverTrack = document.getElementById('leverTrack');
  const leverRod = document.getElementById('leverRod');
  const leverKnob = document.getElementById('leverKnob');
  const MAX_DRAG = 74;
  const PULL_THRESHOLD = 0.68;
  let dragging = false;
  let dragStartY = 0;

  function setLeverPos(dist) {
    const pct = dist / MAX_DRAG;
    leverKnob.style.transform = `translateX(-50%) translateY(${dist}px)`;
    leverRod.style.transform = `translateX(-50%) rotate(${pct * 22}deg)`;
  }

  function onPointerDown(e) {
    if (spinning) return;
    dragging = true;
    leverTrack.classList.add('dragging');
    dragStartY = e.clientY;
    leverTrack.setPointerCapture(e.pointerId);
    ensureAudio();
  }

  function onPointerMove(e) {
    if (!dragging) return;
    const dist = Math.max(0, Math.min(MAX_DRAG, e.clientY - dragStartY));
    setLeverPos(dist);
  }

  function onPointerUp(e) {
    if (!dragging) return;
    dragging = false;
    leverTrack.classList.remove('dragging');
    const dist = Math.max(0, Math.min(MAX_DRAG, e.clientY - dragStartY));
    setLeverPos(0);
    if (dist / MAX_DRAG >= PULL_THRESHOLD) {
      pull();
    }
  }

  leverTrack.addEventListener('pointerdown', onPointerDown);
  leverTrack.addEventListener('pointermove', onPointerMove);
  leverTrack.addEventListener('pointerup', onPointerUp);
  leverTrack.addEventListener('pointercancel', onPointerUp);

  logToggle.addEventListener('click', () => {
    const hidden = logPanel.hasAttribute('hidden');
    if (hidden) {
      logPanel.removeAttribute('hidden');
      renderLog();
      logToggle.textContent = 'hide pitch history';
    } else {
      logPanel.setAttribute('hidden', '');
      logToggle.textContent = 'show pitch history';
    }
  });

  renderStats();
</script>
</body>
</html>
