<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy Me a Beer — Weird Little Games</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #fbeae4;
    --pink-deep: #f6dcd3;
    --ink: #23201d;
    --ink-dim: #56504a;
    --card-bg: #fffaf7;
    --orange: #ff5a1f;
    --red: #ff2d55;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--pink);
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  h1, .display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; font-weight: 400; }
  a { color: var(--orange); text-decoration: none; }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card-bg);
    border: 3px solid var(--ink);
    border-radius: 22px;
    box-shadow: 6px 7px 0 rgba(35,32,29,0.12);
    padding: 32px 28px 28px;
    text-align: center;
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 22px;
  }
  .brand-emoji { font-size: 20px; }
  .brand-name { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 0.03em; }
  .brand-name span { color: var(--orange); }

  h1 { font-size: 34px; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: var(--ink-dim); margin: 0 0 24px; }

  .tiers {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 22px;
  }
  .tier {
    display: block;
    background: var(--orange);
    color: #fff;
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 14px 6px;
  }
  .tier .amount {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    line-height: 1;
  }
  .tier .label {
    font-size: 10.5px;
    opacity: 0.95;
    margin-top: 4px;
  }

  .qr-wrap {
    background: var(--pink-deep);
    border: 2px solid var(--ink);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 10px;
  }
  .qr-wrap img {
    display: block;
    width: 100%;
    max-width: 220px;
    margin: 0 auto 12px;
    border-radius: 8px;
    background: #fff;
  }
  .qr-wrap .qr-label {
    font-size: 12.5px;
    color: var(--ink-dim);
  }

  .wide-btn {
    display: block;
    width: 100%;
    background: var(--card-bg);
    color: var(--ink);
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 12px;
    font-size: 13px;
    margin-top: 10px;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .wide-btn:hover { background: var(--pink); transform: translateY(-1px); }

  .back {
    display: inline-block;
    margin-top: 22px;
    font-size: 11.5px;
    color: var(--ink-dim);
    text-decoration: underline;
  }
  .back:hover { color: var(--orange); }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <span class="brand-emoji">🎮</span>
    <span class="brand-name">Weird&nbsp;<span>Little</span>&nbsp;Games</span>
  </div>

  <h1>Buy me a beer?</h1>
  <p class="subtitle">Keeps the servers on and the ideas weirder.</p>

  <div class="tiers">
    <div class="tier">
      <div class="amount">$3</div>
      <div class="label">a can</div>
    </div>
    <div class="tier">
      <div class="amount">$9</div>
      <div class="label">a six-pack</div>
    </div>
    <div class="tier">
      <div class="amount">$15</div>
      <div class="label">a case</div>
    </div>
  </div>

  <div class="qr-wrap">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Fvenmo.com%2Fu%2FTheDev21" alt="Venmo QR code" width="220" height="220">
    <div class="qr-label">scan with the Venmo app</div>
  </div>

  <a class="wide-btn" href="https://venmo.com/u/TheDev21" target="_blank" rel="noopener">or open Venmo instead</a>

  <a class="back" href="index.html">&larr; nah, back to the games</a>
</div>
</body>
</html>
