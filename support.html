<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy Me a Beer — Weird Little Games</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16.5' r='13.5' fill='%23fffaf7' stroke='%2323201d' stroke-width='2.6'/%3E%3Cellipse cx='10' cy='13.2' rx='4' ry='5' fill='%2323201d' transform='rotate(-5 10 13.2)'/%3E%3Cellipse cx='22' cy='12.8' rx='4.3' ry='5.4' fill='%2323201d' transform='rotate(5 22 12.8)'/%3E%3Cpath d='M6 8 L10 6.6' stroke='%23ff5a1f' stroke-width='1.8' stroke-linecap='round'/%3E%3Cpath d='M26 7.5 L21.8 6.4' stroke='%23ff5a1f' stroke-width='1.8' stroke-linecap='round'/%3E%3Cellipse cx='16' cy='23.5' rx='6.2' ry='5.4' fill='%2323201d' transform='rotate(-2 16 23.5)'/%3E%3Cellipse cx='16' cy='25' rx='2.8' ry='1.6' fill='%23ff5a1f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --pink: #fbeae4;
    --pink-deep: #f6dcd3;
    --ink: #23201d;
    --ink-dim: #56504a;
    --card-bg: #fffaf7;
    --orange: #ff5a1f;
    --red: #ff2d55;
    --venmo: #3d95ce;
    --venmo-dark: #2a7ab0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--pink);
    background-image: radial-gradient(circle, rgba(35,32,29,0.06) 1px, transparent 1px);
    background-size: 26px 26px;
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    position: relative;
    overflow-x: hidden;
  }

  .side-text {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(32px, 5vw, 60px);
    color: rgba(35,32,29,0.07);
    letter-spacing: 0.06em;
    writing-mode: vertical-rl;
    pointer-events: none;
    z-index: 0;
  }
  .side-text.left { left: 4%; transform: translateY(-50%) rotate(180deg); }
  .side-text.right { right: 4%; }
  @media (max-width: 900px) {
    .side-text { display: none; }
  }
  h1, .display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; font-weight: 400; }
  a, button { color: var(--orange); text-decoration: none; }

  .card {
    width: 100%;
    max-width: 460px;
    background: var(--card-bg);
    border: 3px solid var(--ink);
    border-radius: 22px;
    box-shadow: 6px 7px 0 rgba(35,32,29,0.12);
    padding: 30px 32px 26px;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 18px;
  }
  .brand-name { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 0.03em; }
  .brand-name span { color: var(--orange); }

  h1 { font-size: 38px; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: var(--ink-dim); margin: 0 0 22px; }

  .tiers {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .tier {
    display: block;
    width: 100%;
    background: var(--orange);
    color: #fff;
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 16px 6px;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .tier:hover { background: var(--red); transform: translateY(-2px); }
  .tier .amount {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    line-height: 1;
  }
  .tier .label {
    font-size: 11px;
    opacity: 0.95;
    margin-top: 3px;
  }

  .custom-btn {
    display: block;
    width: 100%;
    background: var(--orange);
    color: #fff;
    font-weight: 500;
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 13px;
    font-size: 13.5px;
    margin-bottom: 10px;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .custom-btn:hover { background: var(--red); transform: translateY(-2px); }

  .no-tip {
    display: block;
    width: 100%;
    background: none;
    border: none;
    color: var(--ink-dim);
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    padding: 6px;
  }
  .no-tip:hover { color: var(--orange); }

  .back {
    display: inline-block;
    margin-top: 16px;
    font-size: 11.5px;
    color: var(--ink-dim);
    text-decoration: underline;
  }
  .back:hover { color: var(--orange); }

  /* ---- modal ---- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(35,32,29,0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .overlay.show { display: flex; }

  .modal {
    background: var(--card-bg);
    border: 3px solid var(--ink);
    border-radius: 22px;
    box-shadow: 6px 7px 0 rgba(35,32,29,0.25);
    padding: 26px 28px 22px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    position: relative;
  }
  .modal-close {
    position: absolute;
    top: 10px;
    right: 12px;
    background: none;
    border: none;
    font-size: 20px;
    color: var(--ink-dim);
    cursor: pointer;
    line-height: 1;
  }
  .modal-close:hover { color: var(--orange); }

  .modal-amount {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 44px;
    line-height: 1;
    margin-bottom: 2px;
  }
  .modal-tier-msg {
    font-size: 12.5px;
    color: var(--ink-dim);
    margin-bottom: 16px;
  }
  .modal-tier-msg span { color: var(--ink); font-weight: 500; }

  .modal-slider-row {
    margin-bottom: 16px;
  }
  .modal-slider-row input[type="range"] {
    width: 100%;
    accent-color: var(--orange);
  }

  .qr-box {
    background: var(--venmo);
    border: 2px solid var(--ink);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 14px;
  }
  #qrcode {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 10px;
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
    width: 168px;
    height: 168px;
    padding: 10px;
    border: 2px solid var(--ink);
  }
  .qr-caption {
    font-size: 12px;
    color: #fff;
    font-weight: 500;
  }

  .modal-btn {
    display: block;
    width: 100%;
    background: var(--venmo);
    color: #fff;
    font-weight: 500;
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 12px;
    font-size: 13px;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .modal-btn:hover { background: var(--venmo-dark); transform: translateY(-1px); }
</style>
</head>
<body>
<div class="side-text left">CHEERS &middot; THANKS &middot; CHEERS</div>
<div class="side-text right">CHEERS &middot; THANKS &middot; CHEERS</div>

<div class="card">
  <div class="brand">
    <span class="brand-name">Weird&nbsp;<span>Little</span>&nbsp;Games</span>
  </div>

  <h1>Buy me a beer?</h1>
  <p class="subtitle">Keeps the servers on and the ideas weirder.</p>

  <div class="tiers">
    <button class="tier" data-amount="3">
      <div class="amount">$3</div>
      <div class="label">a can</div>
    </button>
    <button class="tier" data-amount="9">
      <div class="amount">$9</div>
      <div class="label">a six-pack</div>
    </button>
    <button class="tier" data-amount="15">
      <div class="amount">$15</div>
      <div class="label">a case</div>
    </button>
  </div>

  <button class="custom-btn" id="customOpenBtn">Custom</button>
  <button class="no-tip" id="noTipBtn">no tip, just looking</button>

</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalPreset">
    <button class="modal-close" data-close>&times;</button>
    <div class="modal-amount" id="modalAmount">$3</div>
    <div class="modal-tier-msg" id="modalTierMsg"></div>

    <div class="modal-slider-row" id="modalSliderRow" hidden>
      <input type="range" id="customAmount" min="1" max="100" value="10" step="1">
    </div>

    <div class="qr-box">
      <div id="qrcode"></div>
      <div class="qr-caption">scan with the Venmo app</div>
    </div>

    <a class="modal-btn" id="modalOpenVenmo" href="https://venmo.com/u/TheDev21" target="_blank" rel="noopener">or open Venmo instead</a>
  </div>
</div>

<script>
  var tiers = [
    { max: 2,   label: "a shot glass" },
    { max: 5,   label: "a can" },
    { max: 9,   label: "a pint" },
    { max: 14,  label: "a pitcher" },
    { max: 24,  label: "a round for the table" },
    { max: 49,  label: "top shelf treatment" },
    { max: 99,  label: "basically my best friend now" },
    { max: 100, label: "you own a piece of this website, emotionally" }
  ];

  function tierFor(amount) {
    for (var i = 0; i < tiers.length; i++) {
      if (amount <= tiers[i].max) return tiers[i].label;
    }
    return tiers[tiers.length - 1].label;
  }

  var overlay = document.getElementById('overlay');
  var modalAmount = document.getElementById('modalAmount');
  var modalTierMsg = document.getElementById('modalTierMsg');
  var modalSliderRow = document.getElementById('modalSliderRow');
  var slider = document.getElementById('customAmount');
  var qrGenerated = false;

  function ensureQR() {
    if (qrGenerated) return;
    new QRCode(document.getElementById("qrcode"), {
      text: "https://venmo.com/u/TheDev21",
      width: 148,
      height: 148,
      colorDark: "#23201d",
      colorLight: "#ffffff"
    });
    qrGenerated = true;
  }

  function setAmount(amount) {
    modalAmount.textContent = '$' + amount;
    modalTierMsg.innerHTML = 'That gets you <span>' + tierFor(amount) + '</span>.';
  }

  function openModal(amount, custom) {
    ensureQR();
    modalSliderRow.hidden = !custom;
    if (custom) {
      slider.value = amount;
      setAmount(amount);
    } else {
      setAmount(amount);
    }
    overlay.classList.add('show');
  }

  function closeModal() {
    overlay.classList.remove('show');
  }

  document.querySelectorAll('.tier').forEach(function (btn) {
    btn.addEventListener('click', function () {
      openModal(parseInt(btn.dataset.amount, 10), false);
    });
  });

  document.getElementById('customOpenBtn').addEventListener('click', function () {
    openModal(parseInt(slider.value, 10), true);
  });

  document.getElementById('noTipBtn').addEventListener('click', function () {
    window.location.href = 'index.html';
  });

  slider.addEventListener('input', function () {
    setAmount(parseInt(slider.value, 10));
  });

  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) closeModal();
  });
  document.querySelectorAll('[data-close]').forEach(function (btn) {
    btn.addEventListener('click', closeModal);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeModal();
  });
</script>
</body>
</html>
