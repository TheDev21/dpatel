<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Amount — Ctrl+Alt+Defeat</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #fbeae4;
    --pink-deep: #f6dcd3;
    --ink: #23201d;
    --ink-dim: #56504a;
    --card-bg: #fffaf7;
    --orange: #ff5a1f;
    --venmo: #3d95ce;
    --venmo-dark: #2a7ab0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--pink);
    background-image: radial-gradient(circle, rgba(35,32,29,0.06) 1px, transparent 1px);
    background-size: 26px 26px;
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
  }
  h1, .display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; font-weight: 400; }
  a { color: var(--orange); text-decoration: none; }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border: 3px solid var(--ink);
    border-radius: 22px;
    box-shadow: 6px 7px 0 rgba(35,32,29,0.12);
    padding: 32px 32px 26px;
    text-align: center;
  }

  h1 { font-size: 34px; margin: 0 0 6px; }
  .subtitle { font-size: 13px; color: var(--ink-dim); margin: 0 0 26px; }

  .amount-display {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 64px;
    line-height: 1;
    margin-bottom: 14px;
  }

  input[type="range"] {
    width: 100%;
    accent-color: var(--orange);
    margin-bottom: 16px;
  }

  .tier-msg {
    font-size: 13.5px;
    color: var(--ink-dim);
    margin-bottom: 22px;
    min-height: 1.6em;
  }
  .tier-msg span { color: var(--ink); font-weight: 500; }

  .wide-btn {
    display: block;
    width: 100%;
    background: var(--venmo);
    color: #fff;
    font-weight: 500;
    border: 2px solid var(--ink);
    border-radius: 14px;
    padding: 13px;
    font-size: 14px;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    transition: background 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  }
  .wide-btn:hover {
    background: var(--venmo-dark);
    transform: translateY(-1px);
    box-shadow: 2px 3px 0 rgba(35,32,29,0.15);
  }

  .back {
    display: inline-block;
    margin-top: 18px;
    font-size: 11.5px;
    color: var(--ink-dim);
    text-decoration: underline;
  }
  .back:hover { color: var(--orange); }
</style>
</head>
<body>
<div class="card">
  <h1>Name your price</h1>
  <p class="subtitle">Slide it, then send it my way.</p>

  <div class="amount-display" id="amountDisplay">$10</div>
  <input type="range" id="customAmount" min="1" max="100" value="10" step="1">
  <div class="tier-msg" id="tierMsg"></div>

  <a class="wide-btn" id="customBtn" href="https://venmo.com/u/TheDev21" target="_blank" rel="noopener">Send it</a>

  <a class="back" href="support.html">&larr; back to the tip jar</a>
</div>

<script>
  var tiers = [
    { max: 2,   label: "a shot glass" },
    { max: 5,   label: "a can" },
    { max: 9,   label: "a pint" },
    { max: 14,  label: "a pitcher" },
    { max: 24,  label: "a round for the table" },
    { max: 49,  label: "top shelf treatment" },
    { max: 99,  label: "basically my best friend now" },
    { max: 100, label: "you own a piece of this website, emotionally" }
  ];

  function tierFor(amount) {
    for (var i = 0; i < tiers.length; i++) {
      if (amount <= tiers[i].max) return tiers[i].label;
    }
    return tiers[tiers.length - 1].label;
  }

  var slider = document.getElementById('customAmount');
  var amountDisplay = document.getElementById('amountDisplay');
  var tierMsg = document.getElementById('tierMsg');
  var customBtn = document.getElementById('customBtn');

  function updateCustom() {
    var amount = parseInt(slider.value, 10);
    amountDisplay.textContent = '$' + amount;
    tierMsg.innerHTML = 'That gets you <span>' + tierFor(amount) + '</span>.';
    customBtn.textContent = 'Send $' + amount;
  }

  slider.addEventListener('input', updateCustom);
  updateCustom();
</script>
</body>
</html>
